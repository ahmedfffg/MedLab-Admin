<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة التحاليل - معمل ميدلاب</title>
  <link href="../images/logo.png" type="image/x-icon" rel="icon">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #0a7cb8;
      --primary-dark: #085a87;
      --primary-light: #3fa4df;
      --blue-soft: #e8f4fb;
      --blue-softer: #f3f9fd;
      --border: #d8e8f2;
      --text-dark: #143a52;
      --text-medium: #3c6478;
      --text-light: #6d8fa3;
      --success: #1a7d4a;
      --success-soft: #e8f8ef;
      --danger: #c0392b;
      --danger-soft: #fdecea;
      --warning: #d97706;
      --warning-soft: #fff4e5;
      --white: #ffffff;
      --shadow: 0 8px 24px -8px rgba(10, 60, 100, 0.15);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: #f4f9fc;
      color: var(--text-dark);
      line-height: 1.7;
      min-height: 100vh;
    }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    /* Topbar */
    .topbar {
      position: sticky; top:0; z-index:100;
      height: 70px;
      background: white;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(10,60,100,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }
    .brand {
      display: flex; align-items: center; gap: 12px; text-decoration: none;
    }
    .brand-logo {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 20px;
    }
    .brand-text h1 {
      color: var(--primary-dark);
      font-size: 1.15rem;
      line-height: 1.2;
    }
    .brand-text span {
      color: var(--text-light);
      font-size: 12px;
    }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .top-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--primary-dark);
      padding: 9px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      text-decoration: none;
    }
    .top-btn:hover { background: var(--blue-soft); border-color: var(--primary); }

    /* Page */
    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 25px 60px;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .page-head h2 {
      color: var(--primary-dark);
      font-size: 1.7rem;
      margin-bottom: 6px;
    }
    .page-head p { color: var(--text-light); font-size: 14.5px; }

    .add-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      padding: 13px 22px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px -6px rgba(10,124,184,0.5);
      transition: 0.25s;
    }
    .add-btn:hover { transform: translateY(-2px); }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .stat-icon {
      width: 50px; height: 50px;
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .stat-icon.blue   { background: var(--blue-soft); color: var(--primary); }
    .stat-icon.green  { background: var(--success-soft); color: var(--success); }
    .stat-icon.orange { background: var(--warning-soft); color: var(--warning); }
    .stat-icon.purple { background: #f1edff; color: #6950a8; }
    .stat-info span {
      display: block;
      color: var(--text-light);
      font-size: 13px;
      margin-bottom: 3px;
    }
    .stat-info strong {
      display: block;
      color: var(--primary-dark);
      font-size: 1.6rem;
      line-height: 1;
    }

    /* Filters */
    .filters-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1.6fr 1fr auto auto;
      gap: 12px;
      align-items: center;
    }
    .filters-card input,
    .filters-card select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--blue-softer);
      font-size: 14px;
      outline: none;
      transition: 0.2s;
      color: var(--text-dark);
    }
    .filters-card input:focus,
    .filters-card select:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(10,124,184,0.08);
    }
    .filter-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--primary-dark);
      padding: 11px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13.5px;
      transition: 0.2s;
    }
    .filter-btn:hover { background: var(--blue-soft); border-color: var(--primary); }

    /* Table */
    .table-card {
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .table-header h3 { color: var(--primary-dark); font-size: 1.1rem; }
    .table-header .count { color: var(--text-light); font-size: 13px; }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }
    th {
      background: var(--blue-softer);
      color: var(--primary-dark);
      padding: 13px 15px;
      text-align: right;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 13px 15px;
      border-bottom: 1px solid var(--border);
      color: var(--text-medium);
      font-size: 14px;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--blue-softer); }

    .test-name { font-weight: 700; color: var(--text-dark); }
    .price-tag { color: var(--success); font-weight: 700; }
    .category-tag {
      background: var(--blue-soft);
      color: var(--primary-dark);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }
    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .status-badge.active {
      background: var(--success-soft);
      color: var(--success);
    }
    .status-badge.inactive {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .act-btn {
      width: 34px; height: 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: 0.2s;
    }
    .act-btn.edit { color: var(--primary); }
    .act-btn.toggle { color: var(--warning); }
    .act-btn.delete { color: var(--danger); }
    .act-btn:hover { transform: translateY(-2px); background: var(--blue-soft); }

    .loading { text-align: center; padding: 45px; }
    .spinner {
      display: inline-block;
      width: 38px; height: 38px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .empty-state i {
      font-size: 50px;
      margin-bottom: 15px;
      color: var(--border);
      display: block;
    }
    .empty-state h3 { color: var(--text-dark); margin-bottom: 6px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 40, 60, 0.5);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 20px;
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      color: var(--primary-dark);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-header h3 i { color: var(--primary); }
    .close-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: none;
      background: var(--blue-soft);
      color: var(--text-light);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .close-btn:hover { background: var(--danger-soft); color: var(--danger); }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group label i { color: var(--primary); font-size: 12px; }
    .form-group label .required { color: var(--danger); }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--blue-softer);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
      color: var(--text-dark);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(10,124,184,0.08);
    }
    .form-group small { color: var(--text-light); font-size: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .btn {
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      box-shadow: 0 6px 18px -6px rgba(10,124,184,0.5);
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: var(--blue-soft);
      color: var(--primary-dark);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--blue-softer); }
    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover { background: var(--danger); color: white; }

    /* Category list */
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 350px;
      overflow-y: auto;
      margin-top: 15px;
    }
    .category-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--blue-softer);
    }
    .category-item .cat-name {
      font-weight: 700;
      color: var(--text-dark);
    }
    .category-item .cat-count {
      font-size: 12px;
      color: var(--text-light);
      background: white;
      padding: 3px 10px;
      border-radius: 12px;
      margin-right: 8px;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 90px;
      left: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: white;
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 280px;
      max-width: 420px;
      border-right: 4px solid var(--primary);
      animation: toastIn 0.3s ease;
      pointer-events: all;
      font-size: 14px;
      font-weight: 600;
    }
    .toast.success { border-right-color: var(--success); color: var(--success); }
    .toast.error   { border-right-color: var(--danger);  color: var(--danger); }
    .toast.warning { border-right-color: var(--warning); color: var(--warning); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .filters-card { grid-template-columns: 1fr 1fr; }
      .topbar { padding: 0 15px; height: 64px; }
      .brand-text span { display: none; }
      .page { padding: 20px 15px 50px; }
      .page-head h2 { font-size: 1.4rem; }
    }
    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr; }
      .filters-card { grid-template-columns: 1fr; }
      .page-head { flex-direction: column; align-items: stretch; }
      .add-btn { justify-content: center; }
      .form-row { grid-template-columns: 1fr; }
      .top-btn span { display: none; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="admin.html" class="brand">
      <div class="brand-logo"><i class="fas fa-flask"></i></div>
      <div class="brand-text">
        <h1>معمل ميدلاب</h1>
        <span>إدارة التحاليل</span>
      </div>
    </a>
    <div class="top-actions">
      <button class="top-btn" onclick="openCategoryModal()">
        <i class="fas fa-layer-group"></i> <span>التصنيفات</span>
      </button>
      <a href="admin.html" class="top-btn">
        <i class="fas fa-arrow-right"></i> <span>لوحة التحكم</span>
      </a>
    </div>
  </header>

  <main class="page">

    <div class="page-head">
      <div>
        <h2><i class="fas fa-vials"></i> إدارة التحاليل</h2>
        <p>إضافة وتعديل وحذف التحاليل والأسعار والتصنيفات</p>
      </div>
      <button class="add-btn" onclick="openTestModal()">
        <i class="fas fa-plus"></i> إضافة تحليل جديد
      </button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-vials"></i></div>
        <div class="stat-info">
          <span>إجمالي التحاليل</span>
          <strong id="totalTests">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
        <div class="stat-info">
          <span>التحاليل النشطة</span>
          <strong id="activeTests">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><i class="fas fa-pause-circle"></i></div>
        <div class="stat-info">
          <span>التحاليل الموقوفة</span>
          <strong id="inactiveTests">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple"><i class="fas fa-layer-group"></i></div>
        <div class="stat-info">
          <span>التصنيفات</span>
          <strong id="totalCategories">0</strong>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-card">
      <input type="text" id="searchInput" placeholder="🔍 ابحث باسم التحليل...">
      <select id="categoryFilter">
        <option value="">كل التصنيفات</option>
      </select>
      <button class="filter-btn" onclick="loadData()">
        <i class="fas fa-sync"></i> تحديث
      </button>
      <button class="filter-btn" onclick="clearFilters()">
        <i class="fas fa-times"></i> مسح
      </button>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-header">
        <h3><i class="fas fa-list"></i> قائمة التحاليل</h3>
        <span class="count" id="resultsCount">0 تحليل</span>
      </div>
      <div class="table-wrap" id="tableContainer">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

  </main>

  <!-- ============================================
       Test Modal
  ============================================ -->
  <div class="modal-overlay" id="testModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="testModalTitle"><i class="fas fa-vial"></i> إضافة تحليل</h3>
        <button class="close-btn" onclick="closeModal('testModal')">×</button>
      </div>
      <form id="testForm">
        <div class="modal-body">
          <input type="hidden" id="testId">

          <div class="form-group">
            <label><i class="fas fa-vial"></i> اسم التحليل <span class="required">*</span></label>
            <input type="text" id="testName" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label><i class="fas fa-money-bill"></i> السعر (ج.م) <span class="required">*</span></label>
              <input type="number" id="testPrice" min="0" step="0.5" required>
            </div>
            <div class="form-group">
              <label><i class="fas fa-layer-group"></i> التصنيف <span class="required">*</span></label>
              <select id="testCategory" required></select>
            </div>
          </div>

          <div class="form-group">
            <label><i class="fas fa-align-right"></i> وصف التحليل</label>
            <textarea id="testDescription" rows="2" placeholder="اختياري..."></textarea>
          </div>

          <div class="form-group">
            <label><i class="fas fa-toggle-on"></i> حالة التحليل</label>
            <select id="testActive">
              <option value="true">نشط - يظهر للمرضى</option>
              <option value="false">موقوف - لا يظهر</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal('testModal')">إلغاء</button>
          <button type="submit" class="btn btn-primary" id="saveTestBtn">
            <i class="fas fa-save"></i> حفظ
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================
       Category Modal
  ============================================ -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fas fa-layer-group"></i> إدارة التصنيفات</h3>
        <button class="close-btn" onclick="closeModal('categoryModal')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label><i class="fas fa-plus"></i> إضافة تصنيف جديد</label>
          <div style="display: grid; grid-template-columns: 1fr auto; gap: 8px;">
            <input type="text" id="newCategoryName" placeholder="مثال: تحاليل المناعة">
            <button class="btn btn-primary" onclick="addCategory()">
              <i class="fas fa-plus"></i> إضافة
            </button>
          </div>
        </div>

        <div style="margin-top: 20px;">
          <label style="font-weight: 700; color: var(--primary-dark); display: block; margin-bottom: 10px;">
            <i class="fas fa-list"></i> التصنيفات الحالية
          </label>
          <div class="category-list" id="categoryList"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('categoryModal')">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://rlkqifdteyccagpdtdmu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XibO6Ri8DLKHG-rUEp4Bnw_bDzm67Xf';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (sessionStorage.getItem('medlab_admin_logged_in') !== '1') {
      window.location.href = 'admin.html';
    }

    let allTests = [];
    let allCategories = [];
    let filteredTests = [];

    // ============================================
    // HELPERS
    // ============================================
    function escapeHtml(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg, type = 'success') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;

      let icon = 'fa-check-circle';
      if (type === 'error') icon = 'fa-exclamation-circle';
      else if (type === 'warning') icon = 'fa-exclamation-triangle';

      t.innerHTML = `<i class="fas ${icon}"></i> <span>${escapeHtml(msg)}</span>`;
      c.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(-20px)';
        setTimeout(() => t.remove(), 300);
      }, 3500);
    }

    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function formatPrice(p) {
      return Number(p || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
    }

    // ============================================
    // LOAD DATA
    // ============================================
    async function loadData() {
      const container = document.getElementById('tableContainer');
      container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        // Categories
        const { data: cats, error: catErr } = await supabaseClient
          .from('test_categories')
          .select('*')
          .order('name');

        if (catErr) throw catErr;
        allCategories = cats || [];

        // Tests
        const { data: tests, error: testErr } = await supabaseClient
          .from('tests')
          .select('*')
          .order('name');

        if (testErr) throw testErr;
        allTests = tests || [];

        renderCategoryFilters();
        renderCategorySelect();
        updateStats();
        applyFilters();

      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-circle" style="color: var(--danger);"></i>
            <h3>حدث خطأ</h3>
            <p>${escapeHtml(error.message)}</p>
          </div>`;
        showToast('فشل تحميل البيانات', 'error');
      }
    }

    function updateStats() {
      document.getElementById('totalTests').textContent = allTests.length;
      document.getElementById('activeTests').textContent = allTests.filter(t => t.is_active !== false).length;
      document.getElementById('inactiveTests').textContent = allTests.filter(t => t.is_active === false).length;
      document.getElementById('totalCategories').textContent = allCategories.length;
    }

    function renderCategoryFilters() {
      const sel = document.getElementById('categoryFilter');
      const current = sel.value;
      sel.innerHTML = '<option value="">كل التصنيفات</option>';
      allCategories.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = c.name;
        sel.appendChild(o);
      });
      if (current) sel.value = current;
    }

    function renderCategorySelect() {
      const sel = document.getElementById('testCategory');
      const current = sel.value;
      sel.innerHTML = '<option value="">اختر التصنيف</option>';
      allCategories.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = c.name;
        sel.appendChild(o);
      });
      if (current) sel.value = current;
    }

    function renderCategoryList() {
      const container = document.getElementById('categoryList');
      if (allCategories.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-light);">لا توجد تصنيفات</div>';
        return;
      }

      container.innerHTML = allCategories.map(c => {
        const count = allTests.filter(t => Number(t.category_id) === Number(c.id)).length;
        return `
          <div class="category-item">
            <div>
              <span class="cat-name">${escapeHtml(c.name)}</span>
              <span class="cat-count">${count} تحليل</span>
            </div>
            <button class="act-btn delete" 
                    ${count > 0 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}
                    onclick="deleteCategory(${c.id})"
                    title="${count > 0 ? 'لا يمكن الحذف - مرتبط بتحاليل' : 'حذف'}">
              <i class="fas fa-trash"></i>
            </button>
          </div>`;
      }).join('');
    }

    // ============================================
    // FILTERS
    // ============================================
    function applyFilters() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const catId = document.getElementById('categoryFilter').value;

      filteredTests = allTests.filter(t => {
        if (search && !String(t.name || '').toLowerCase().includes(search)) return false;
        if (catId && String(t.category_id) !== String(catId)) return false;
        return true;
      });

      renderTable();
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('categoryFilter').value = '';
      applyFilters();
    }

    // ============================================
    // RENDER TABLE
    // ============================================
    function renderTable() {
      const container = document.getElementById('tableContainer');
      document.getElementById('resultsCount').textContent = `${filteredTests.length} تحليل`;

      if (filteredTests.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-vials"></i>
            <h3>لا توجد تحاليل</h3>
            <p>${allTests.length === 0 ? 'ابدأ بإضافة تحليل جديد' : 'جرّب تغيير الفلاتر'}</p>
          </div>`;
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>اسم التحليل</th>
              <th>التصنيف</th>
              <th>السعر</th>
              <th>الحالة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody>`;

      filteredTests.forEach((t, i) => {
        const cat = allCategories.find(c => Number(c.id) === Number(t.category_id));
        const catName = cat ? cat.name : 'بدون تصنيف';
        const isActive = t.is_active !== false;

        html += `
          <tr>
            <td>${i + 1}</td>
            <td><span class="test-name">${escapeHtml(t.name || '-')}</span></td>
            <td><span class="category-tag">${escapeHtml(catName)}</span></td>
            <td><span class="price-tag">${formatPrice(t.price)} ج</span></td>
            <td>
              <span class="status-badge ${isActive ? 'active' : 'inactive'}">
                <i class="fas fa-circle" style="font-size: 8px;"></i>
                ${isActive ? 'نشط' : 'موقوف'}
              </span>
            </td>
            <td>
              <div class="actions">
                <button class="act-btn edit" onclick="openTestModal(${t.id})" title="تعديل">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="act-btn toggle" onclick="toggleTest(${t.id})" title="${isActive ? 'إيقاف' : 'تفعيل'}">
                  <i class="fas fa-${isActive ? 'pause' : 'play'}"></i>
                </button>
                <button class="act-btn delete" onclick="deleteTest(${t.id})" title="حذف">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>`;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    // ============================================
    // TEST MODAL
    // ============================================
    function openTestModal(id = null) {
      const form = document.getElementById('testForm');
      form.reset();
      renderCategorySelect();

      if (id) {
        const t = allTests.find(x => x.id === id);
        if (!t) return;

        document.getElementById('testModalTitle').innerHTML = '<i class="fas fa-edit"></i> تعديل التحليل';
        document.getElementById('testId').value = t.id;
        document.getElementById('testName').value = t.name || '';
        document.getElementById('testPrice').value = t.price || 0;
        document.getElementById('testCategory').value = t.category_id || '';
        document.getElementById('testDescription').value = t.description || '';
        document.getElementById('testActive').value = String(t.is_active !== false);
      } else {
        document.getElementById('testModalTitle').innerHTML = '<i class="fas fa-plus"></i> إضافة تحليل';
        document.getElementById('testId').value = '';
        document.getElementById('testActive').value = 'true';
      }

      openModal('testModal');
    }

    document.getElementById('testForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const id = document.getElementById('testId').value;
      const name = document.getElementById('testName').value.trim();
      const price = Number(document.getElementById('testPrice').value);
      const categoryId = document.getElementById('testCategory').value;
      const description = document.getElementById('testDescription').value.trim();
      const isActive = document.getElementById('testActive').value === 'true';

      if (!name || !categoryId || !Number.isFinite(price) || price < 0) {
        return showToast('الرجاء ملء كل الحقول المطلوبة', 'warning');
      }

      const btn = document.getElementById('saveTestBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      try {
        const payload = {
          name,
          category_id: Number(categoryId),
          price,
          description: description || null,
          is_active: isActive,
          updated_at: new Date().toISOString()
        };

        if (id) {
          const { error } = await supabaseClient
            .from('tests')
            .update(payload)
            .eq('id', Number(id));
          if (error) throw error;
          showToast('✅ تم تعديل التحليل', 'success');
        } else {
          const { error } = await supabaseClient
            .from('tests')
            .insert(payload);
          if (error) throw error;
          showToast('✅ تم إضافة التحليل', 'success');
        }

        closeModal('testModal');
        await loadData();

      } catch (error) {
        console.error(error);
        if (error.code === '23505') showToast('هذا الاسم موجود بالفعل', 'error');
        else showToast('فشل الحفظ: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
      }
    });

    // ============================================
    // DELETE / TOGGLE
    // ============================================
    async function deleteTest(id) {
      const t = allTests.find(x => x.id === id);
      if (!t) return;

      if (!confirm(`هل تريد حذف التحليل "${t.name}"؟`)) return;

      try {
        // فحص إذا مستخدم في باقة
        const { data: inPackage } = await supabaseClient
          .from('package_tests')
          .select('id')
          .eq('test_id', id)
          .limit(1);

        if (inPackage && inPackage.length > 0) {
          showToast('لا يمكن الحذف - التحليل مستخدم في باقة. أوقفه بدل الحذف.', 'warning');
          return;
        }

        const { error } = await supabaseClient
          .from('tests')
          .delete()
          .eq('id', id);

        if (error) throw error;
        showToast('✅ تم الحذف', 'success');
        await loadData();

      } catch (error) {
        console.error(error);
        showToast('فشل الحذف: ' + error.message, 'error');
      }
    }

    async function toggleTest(id) {
      const t = allTests.find(x => x.id === id);
      if (!t) return;

      const newStatus = t.is_active === false;

      try {
        const { error } = await supabaseClient
          .from('tests')
          .update({ is_active: newStatus, updated_at: new Date().toISOString() })
          .eq('id', id);

        if (error) throw error;
        showToast(newStatus ? '✅ تم التفعيل' : '✅ تم الإيقاف', 'success');
        await loadData();

      } catch (error) {
        console.error(error);
        showToast('فشل التعديل', 'error');
      }
    }

    // ============================================
    // CATEGORIES
    // ============================================
    function openCategoryModal() {
      renderCategoryList();
      openModal('categoryModal');
    }

    async function addCategory() {
      const name = document.getElementById('newCategoryName').value.trim();
      if (!name) return showToast('اكتب اسم التصنيف', 'warning');

      try {
        const { error } = await supabaseClient
          .from('test_categories')
          .insert({ name });

        if (error) {
          if (error.code === '23505') throw new Error('هذا التصنيف موجود بالفعل');
          throw error;
        }

        document.getElementById('newCategoryName').value = '';
        showToast('✅ تم إضافة التصنيف', 'success');
        await loadData();
        renderCategoryList();

      } catch (error) {
        console.error(error);
        showToast(error.message || 'فشل الإضافة', 'error');
      }
    }

    async function deleteCategory(id) {
      const c = allCategories.find(x => x.id === id);
      if (!c) return;

      const count = allTests.filter(t => Number(t.category_id) === Number(id)).length;
      if (count > 0) {
        return showToast('لا يمكن حذف تصنيف مرتبط بتحاليل', 'warning');
      }

      if (!confirm(`هل تريد حذف التصنيف "${c.name}"؟`)) return;

      try {
        const { error } = await supabaseClient
          .from('test_categories')
          .delete()
          .eq('id', id);

        if (error) throw error;
        showToast('✅ تم حذف التصنيف', 'success');
        await loadData();
        renderCategoryList();

      } catch (error) {
        console.error(error);
        showToast('فشل الحذف', 'error');
      }
    }

    // ============================================
    // EVENTS
    // ============================================
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('categoryFilter').addEventListener('change', applyFilters);

    ['testModal', 'categoryModal'].forEach(id => {
      document.getElementById(id).addEventListener('click', function (e) {
        if (e.target === this) closeModal(id);
      });
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal('testModal');
        closeModal('categoryModal');
      }
    });

    // Start
    loadData();

    console.log('✅ صفحة إدارة التحاليل جاهزة');
  </script>
