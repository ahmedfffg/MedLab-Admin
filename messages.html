<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الرسائل - معمل ميدلاب</title>
  <link href="../images/logo.png" type="image/x-icon" rel="icon">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #0a7cb8;
      --primary-dark: #085a87;
      --primary-light: #3fa4df;
      --blue-soft: #e8f4fb;
      --blue-softer: #f3f9fd;
      --border: #d8e8f2;
      --text-dark: #143a52;
      --text-medium: #3c6478;
      --text-light: #6d8fa3;
      --success: #1a7d4a;
      --success-soft: #e8f8ef;
      --danger: #c0392b;
      --danger-soft: #fdecea;
      --warning: #d97706;
      --warning-soft: #fff4e5;
      --purple: #6950a8;
      --purple-soft: #f1edff;
      --white: #ffffff;
      --shadow: 0 8px 24px -8px rgba(10, 60, 100, 0.15);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: #f4f9fc;
      color: var(--text-dark);
      line-height: 1.7;
      min-height: 100vh;
    }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    /* Topbar */
    .topbar {
      position: sticky; top:0; z-index:100;
      height: 70px;
      background: white;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(10,60,100,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }
    .brand {
      display: flex; align-items: center; gap: 12px; text-decoration: none;
    }
    .brand-logo {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 20px;
    }
    .brand-text h1 { color: var(--primary-dark); font-size: 1.15rem; line-height: 1.2; }
    .brand-text span { color: var(--text-light); font-size: 12px; }
    .top-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--primary-dark);
      padding: 9px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      text-decoration: none;
    }
    .top-btn:hover { background: var(--blue-soft); border-color: var(--primary); }

    /* Page */
    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 25px 60px;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .page-head h2 { color: var(--primary-dark); font-size: 1.7rem; margin-bottom: 6px; }
    .page-head p { color: var(--text-light); font-size: 14.5px; }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .stat-icon {
      width: 50px; height: 50px;
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .stat-icon.blue   { background: var(--blue-soft); color: var(--primary); }
    .stat-icon.orange { background: var(--warning-soft); color: var(--warning); }
    .stat-icon.green  { background: var(--success-soft); color: var(--success); }
    .stat-icon.purple { background: var(--purple-soft); color: var(--purple); }
    .stat-info span { display: block; color: var(--text-light); font-size: 13px; margin-bottom: 3px; }
    .stat-info strong { display: block; color: var(--primary-dark); font-size: 1.6rem; line-height: 1; }

    /* Filters */
    .filters-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr auto;
      gap: 12px;
    }
    .filters-card input,
    .filters-card select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--blue-softer);
      font-size: 14px;
      outline: none;
      transition: 0.2s;
      color: var(--text-dark);
    }
    .filters-card input:focus,
    .filters-card select:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(10,124,184,0.08);
    }
    .filter-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--primary-dark);
      padding: 11px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13.5px;
    }
    .filter-btn:hover { background: var(--blue-soft); border-color: var(--primary); }

    /* Table */
    .table-card {
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .table-header h3 { color: var(--primary-dark); font-size: 1.1rem; }
    .table-header .count { color: var(--text-light); font-size: 13px; }

    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }
    th {
      background: var(--blue-softer);
      color: var(--primary-dark);
      padding: 13px 15px;
      text-align: right;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 13px 15px;
      border-bottom: 1px solid var(--border);
      color: var(--text-medium);
      font-size: 14px;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--blue-softer); }

    .sender-name { font-weight: 700; color: var(--text-dark); margin-bottom: 3px; }
    .sender-contact {
      font-size: 12px;
      color: var(--text-light);
      direction: ltr;
    }
    .message-preview {
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-medium);
    }

    .type-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .type-complaint  { background: var(--danger-soft);  color: var(--danger); }
    .type-inquiry    { background: var(--blue-soft);    color: var(--primary); }
    .type-suggestion { background: var(--warning-soft); color: var(--warning); }
    .type-other      { background: var(--purple-soft);  color: var(--purple); }

    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }
    .status-new       { background: var(--blue-soft);    color: var(--primary); }
    .status-reviewing { background: var(--warning-soft); color: var(--warning); }
    .status-replied   { background: var(--success-soft); color: var(--success); }
    .status-closed    { background: #e9ecef;             color: #495057; }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .act-btn {
      width: 34px; height: 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: 0.2s;
    }
    .act-btn.view { color: var(--primary); }
    .act-btn.edit { color: var(--warning); }
    .act-btn.delete { color: var(--danger); }
    .act-btn:hover { transform: translateY(-2px); background: var(--blue-soft); }

    .loading { text-align: center; padding: 45px; }
    .spinner {
      display: inline-block;
      width: 38px; height: 38px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .empty-state i {
      font-size: 50px;
      margin-bottom: 15px;
      color: var(--border);
      display: block;
    }
    .empty-state h3 { color: var(--text-dark); margin-bottom: 6px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 40, 60, 0.5);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 20px;
      width: 100%;
      max-width: 700px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      color: var(--primary-dark);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-header h3 i { color: var(--primary); }
    .close-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: none;
      background: var(--blue-soft);
      color: var(--text-light);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .close-btn:hover { background: var(--danger-soft); color: var(--danger); }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .info-box {
      background: var(--blue-softer);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .info-box.full { grid-column: 1 / -1; }
    .info-box label {
      display: block;
      font-size: 11.5px;
      color: var(--text-light);
      margin-bottom: 3px;
    }
    .info-box strong {
      color: var(--text-dark);
      font-size: 14px;
      word-break: break-word;
    }
    .info-box strong[dir="ltr"] { direction: ltr; }

    .message-body {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      line-height: 1.8;
      color: var(--text-medium);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .reply-box {
      background: var(--blue-softer);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 15px;
    }
    .reply-box label {
      display: block;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 8px;
      font-size: 13.5px;
    }
    .reply-box textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: white;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      resize: vertical;
      min-height: 80px;
      color: var(--text-dark);
    }
    .reply-box textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(10,124,184,0.08);
    }

    .btn {
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      box-shadow: 0 6px 18px -6px rgba(10,124,184,0.5);
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: var(--blue-soft);
      color: var(--primary-dark);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--blue-softer); }
    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover { background: var(--danger); color: white; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 90px;
      left: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: white;
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 280px;
      max-width: 420px;
      border-right: 4px solid var(--primary);
      animation: toastIn 0.3s ease;
      pointer-events: all;
      font-size: 14px;
      font-weight: 600;
    }
    .toast.success { border-right-color: var(--success); color: var(--success); }
    .toast.error   { border-right-color: var(--danger);  color: var(--danger); }
    .toast.warning { border-right-color: var(--warning); color: var(--warning); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .filters-card { grid-template-columns: 1fr 1fr; }
      .topbar { padding: 0 15px; height: 64px; }
      .brand-text span { display: none; }
      .page { padding: 20px 15px 50px; }
      .page-head h2 { font-size: 1.4rem; }
      .info-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr; }
      .filters-card { grid-template-columns: 1fr; }
      .top-btn span { display: none; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="admin.html" class="brand">
      <div class="brand-logo"><i class="fas fa-envelope"></i></div>
      <div class="brand-text">
        <h1>معمل ميدلاب</h1>
        <span>إدارة الرسائل</span>
      </div>
    </a>
    <a href="admin.html" class="top-btn">
      <i class="fas fa-arrow-right"></i> <span>لوحة التحكم</span>
    </a>
  </header>

  <main class="page">

    <div class="page-head">
      <div>
        <h2><i class="fas fa-envelope"></i> إدارة الرسائل</h2>
        <p>متابعة الشكاوى والاستفسارات والمقترحات من العملاء</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-envelope"></i></div>
        <div class="stat-info">
          <span>إجمالي الرسائل</span>
          <strong id="totalMessages">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><i class="fas fa-bell"></i></div>
        <div class="stat-info">
          <span>رسائل جديدة</span>
          <strong id="newMessages">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
        <div class="stat-info">
          <span>تم الرد عليها</span>
          <strong id="repliedMessages">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="stat-info">
          <span>الشكاوى</span>
          <strong id="complaintMessages">0</strong>
        </div>
      </div>
    </div>

    <div class="filters-card">
      <input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم أو الهاتف أو البريد...">
      <select id="typeFilter">
        <option value="">كل الأنواع</option>
        <option value="complaint">شكوى</option>
        <option value="inquiry">استفسار</option>
        <option value="suggestion">مقترح</option>
        <option value="other">أخرى</option>
      </select>
      <select id="statusFilter">
        <option value="">كل الحالات</option>
        <option value="new">جديد</option>
        <option value="reviewing">قيد المراجعة</option>
        <option value="replied">تم الرد</option>
        <option value="closed">مغلق</option>
      </select>
      <button class="filter-btn" onclick="loadMessages()">
        <i class="fas fa-sync"></i> تحديث
      </button>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h3><i class="fas fa-list"></i> قائمة الرسائل</h3>
        <span class="count" id="resultsCount">0 رسالة</span>
      </div>
      <div class="table-wrap" id="tableContainer">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

  </main>

  <!-- View/Reply Modal -->
  <div class="modal-overlay" id="viewModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fas fa-envelope-open-text"></i> تفاصيل الرسالة</h3>
        <button class="close-btn" onclick="closeModal('viewModal')">×</button>
      </div>
      <div class="modal-body" id="viewModalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('viewModal')">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" style="max-width: 440px;">
      <div class="modal-header">
        <h3 style="color: var(--danger);"><i class="fas fa-exclamation-triangle"></i> تأكيد الحذف</h3>
        <button class="close-btn" onclick="closeModal('deleteModal')">×</button>
      </div>
      <div class="modal-body">
        <p style="text-align: center;">هل أنت متأكد من حذف هذه الرسالة؟</p>
      </div>
      <div class="modal-footer" style="justify-content: center;">
        <button class="btn btn-ghost" onclick="closeModal('deleteModal')">إلغاء</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">
          <i class="fas fa-trash"></i> حذف
        </button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://rlkqifdteyccagpdtdmu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XibO6Ri8DLKHG-rUEp4Bnw_bDzm67Xf';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (sessionStorage.getItem('medlab_admin_logged_in') !== '1') {
      window.location.href = 'admin.html';
    }

    let allMessages = [];
    let filteredMessages = [];
    let deleteTargetId = null;

    // ============================================
    // HELPERS
    // ============================================
    function escapeHtml(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg, type = 'success') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      let icon = 'fa-check-circle';
      if (type === 'error') icon = 'fa-exclamation-circle';
      else if (type === 'warning') icon = 'fa-exclamation-triangle';
      t.innerHTML = `<i class="fas ${icon}"></i> <span>${escapeHtml(msg)}</span>`;
      c.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(-20px)';
        setTimeout(() => t.remove(), 300);
      }, 3500);
    }

    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function formatDateTime(d) {
      if (!d) return '-';
      try {
        return new Date(d).toLocaleString('ar-EG', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        });
      } catch { return d; }
    }

    function getTypeText(t) {
      const map = {
        complaint: 'شكوى',
        inquiry: 'استفسار',
        suggestion: 'مقترح',
        other: 'أخرى'
      };
      return map[t] || t || '-';
    }

    function getTypeClass(t) {
      return {
        complaint: 'type-complaint',
        inquiry: 'type-inquiry',
        suggestion: 'type-suggestion',
        other: 'type-other'
      }[t] || 'type-other';
    }

    function getStatusText(s) {
      const map = {
        new: 'جديد',
        reviewing: 'قيد المراجعة',
        replied: 'تم الرد',
        closed: 'مغلق'
      };
      return map[s] || s || '-';
    }

    function getStatusClass(s) {
      return {
        new: 'status-new',
        reviewing: 'status-reviewing',
        replied: 'status-replied',
        closed: 'status-closed'
      }[s] || 'status-new';
    }

    // ============================================
    // LOAD
    // ============================================
    async function loadMessages() {
      const container = document.getElementById('tableContainer');
      container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const { data, error } = await supabaseClient
          .from('contact_messages')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        allMessages = data || [];

        updateStats();
        applyFilters();

      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-circle" style="color: var(--danger);"></i>
            <h3>حدث خطأ</h3>
            <p>${escapeHtml(error.message)}</p>
          </div>`;
        showToast('فشل تحميل الرسائل', 'error');
      }
    }

    function updateStats() {
      document.getElementById('totalMessages').textContent = allMessages.length;
      document.getElementById('newMessages').textContent = allMessages.filter(m => m.status === 'new').length;
      document.getElementById('repliedMessages').textContent = allMessages.filter(m => m.status === 'replied').length;
      document.getElementById('complaintMessages').textContent = allMessages.filter(m => m.message_type === 'complaint').length;
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const type = document.getElementById('typeFilter').value;
      const status = document.getElementById('statusFilter').value;

      filteredMessages = allMessages.filter(m => {
        if (search) {
          const combined = [m.name, m.email, m.phone, m.message].filter(Boolean).join(' ').toLowerCase();
          if (!combined.includes(search)) return false;
        }
        if (type && m.message_type !== type) return false;
        if (status && m.status !== status) return false;
        return true;
      });

      renderTable();
    }

    // ============================================
    // RENDER
    // ============================================
    function renderTable() {
      const container = document.getElementById('tableContainer');
      document.getElementById('resultsCount').textContent = `${filteredMessages.length} رسالة`;

      if (filteredMessages.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <h3>لا توجد رسائل</h3>
            <p>${allMessages.length === 0 ? 'لم يستقبل المعمل رسائل بعد' : 'جرّب تغيير الفلاتر'}</p>
          </div>`;
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>المرسل</th>
              <th>النوع</th>
              <th>الرسالة</th>
              <th>التاريخ</th>
              <th>الحالة</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody>`;

      filteredMessages.forEach(m => {
        html += `
          <tr>
            <td>
              <div class="sender-name">${escapeHtml(m.name || '-')}</div>
              <div class="sender-contact" dir="ltr">${escapeHtml(m.email || '')}<br>${escapeHtml(m.phone || '')}</div>
            </td>
            <td>
              <span class="type-badge ${getTypeClass(m.message_type)}">
                ${getTypeText(m.message_type)}
              </span>
            </td>
            <td>
              <div class="message-preview" title="${escapeHtml(m.message || '')}">${escapeHtml(m.message || '-')}</div>
            </td>
            <td style="font-size:12.5px; white-space:nowrap;">${formatDateTime(m.created_at)}</td>
            <td>
              <span class="status-badge ${getStatusClass(m.status)}">
                ${getStatusText(m.status)}
              </span>
            </td>
            <td>
              <div class="actions">
                <button class="act-btn view" onclick="viewMessage(${m.id})" title="عرض">
                  <i class="fas fa-eye"></i>
                </button>
                <button class="act-btn edit" onclick="changeStatus(${m.id})" title="تغيير الحالة">
                  <i class="fas fa-tag"></i>
                </button>
                <button class="act-btn delete" onclick="askDelete(${m.id})" title="حذف">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>`;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    // ============================================
    // VIEW MESSAGE
    // ============================================
    async function viewMessage(id) {
      const m = allMessages.find(x => x.id === id);
      if (!m) return;

      // تحديث الحالة إلى "مقروء" إذا كانت "جديد"
      if (m.status === 'new') {
        try {
          await supabaseClient
            .from('contact_messages')
            .update({ status: 'reviewing', updated_at: new Date().toISOString() })
            .eq('id', id);
          m.status = 'reviewing';
          updateStats();
        } catch (e) { console.warn(e); }
      }

      const replyHtml = m.admin_reply
        ? `<div style="background:var(--success-soft); border:1px solid var(--success); border-radius:10px; padding:14px; margin-bottom:20px;">
             <label style="display:block; font-weight:700; color:var(--success); margin-bottom:6px; font-size:13px;">
               <i class="fas fa-reply"></i> الرد المُرسل
             </label>
             <div style="color:var(--text-dark); white-space:pre-wrap;">${escapeHtml(m.admin_reply)}</div>
           </div>`
        : '';

      document.getElementById('viewModalBody').innerHTML = `
        <div class="info-grid">
          <div class="info-box">
            <label>الاسم</label>
            <strong>${escapeHtml(m.name || '-')}</strong>
          </div>
          <div class="info-box">
            <label>النوع</label>
            <strong>${getTypeText(m.message_type)}</strong>
          </div>
          <div class="info-box">
            <label>البريد الإلكتروني</label>
            <strong dir="ltr">${escapeHtml(m.email || '-')}</strong>
          </div>
          <div class="info-box">
            <label>الهاتف</label>
            <strong dir="ltr">${escapeHtml(m.phone || '-')}</strong>
          </div>
          <div class="info-box">
            <label>الحالة</label>
            <strong>${getStatusText(m.status)}</strong>
          </div>
          <div class="info-box">
            <label>التاريخ</label>
            <strong>${formatDateTime(m.created_at)}</strong>
          </div>
        </div>

        <label style="display:block; font-weight:700; color:var(--primary-dark); margin-bottom:8px; font-size:14px;">
          <i class="fas fa-comment"></i> نص الرسالة
        </label>
        <div class="message-body">${escapeHtml(m.message || '')}</div>

        ${replyHtml}

        <div class="reply-box">
          <label><i class="fas fa-reply"></i> ${m.admin_reply ? 'تعديل الرد' : 'إضافة رد'}</label>
          <textarea id="replyText" placeholder="اكتب ردك هنا...">${escapeHtml(m.admin_reply || '')}</textarea>
          <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="saveReply(${id})">
              <i class="fas fa-paper-plane"></i> حفظ الرد
            </button>
            <button class="btn btn-ghost" onclick="changeStatusTo(${id}, 'replied')">
              <i class="fas fa-check"></i> تحديد "تم الرد"
            </button>
            <button class="btn btn-ghost" onclick="changeStatusTo(${id}, 'closed')">
              <i class="fas fa-lock"></i> إغلاق
            </button>
          </div>
        </div>
      `;

      openModal('viewModal');
      renderTable();
    }

    async function saveReply(id) {
      const reply = document.getElementById('replyText').value.trim();
      if (!reply) return showToast('اكتب الرد أولاً', 'warning');

      try {
        const { error } = await supabaseClient
          .from('contact_messages')
          .update({
            admin_reply: reply,
            status: 'replied',
            updated_at: new Date().toISOString()
          })
          .eq('id', id);

        if (error) throw error;

        const m = allMessages.find(x => x.id === id);
        if (m) {
          m.admin_reply = reply;
          m.status = 'replied';
        }

        showToast('✅ تم حفظ الرد', 'success');
        closeModal('viewModal');
        updateStats();
        renderTable();

      } catch (error) {
        console.error(error);
        showToast('فشل الحفظ', 'error');
      }
    }

    async function changeStatusTo(id, newStatus) {
      try {
        const { error } = await supabaseClient
          .from('contact_messages')
          .update({ status: newStatus, updated_at: new Date().toISOString() })
          .eq('id', id);

        if (error) throw error;

        const m = allMessages.find(x => x.id === id);
        if (m) m.status = newStatus;

        showToast('✅ تم التحديث', 'success');
        closeModal('viewModal');
        updateStats();
        renderTable();

      } catch (error) {
        console.error(error);
        showToast('فشل التحديث', 'error');
      }
    }

    // ============================================
    // CHANGE STATUS
    // ============================================
    async function changeStatus(id) {
      const m = allMessages.find(x => x.id === id);
      if (!m) return;

      const options = [
        ['new', 'جديد'],
        ['reviewing', 'قيد المراجعة'],
        ['replied', 'تم الرد'],
        ['closed', 'مغلق']
      ];

      let msg = 'اختر الحالة الجديدة:\n\n';
      options.forEach((o, i) => msg += `${i + 1} - ${o[1]}\n`);

      const currentIdx = options.findIndex(o => o[0] === m.status);
      const answer = prompt(msg, String(currentIdx >= 0 ? currentIdx + 1 : 1));

      if (answer === null) return;

      const num = Number(answer);
      if (!Number.isInteger(num) || num < 1 || num > options.length) {
        return showToast('اختيار غير صحيح', 'warning');
      }

      const newStatus = options[num - 1][0];
      if (newStatus === m.status) return;

      try {
        const { error } = await supabaseClient
          .from('contact_messages')
          .update({ status: newStatus, updated_at: new Date().toISOString() })
          .eq('id', id);

        if (error) throw error;

        m.status = newStatus;
        showToast('✅ تم التحديث', 'success');
        updateStats();
        renderTable();

      } catch (error) {
        console.error(error);
        showToast('فشل التحديث', 'error');
      }
    }

    // ============================================
    // DELETE
    // ============================================
    function askDelete(id) {
      deleteTargetId = id;
      openModal('deleteModal');
    }

    document.getElementById('confirmDeleteBtn').addEventListener('click', async function () {
      if (!deleteTargetId) return;

      const btn = this;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحذف...';

      try {
        const { error } = await supabaseClient
          .from('contact_messages')
          .delete()
          .eq('id', deleteTargetId);

        if (error) throw error;

        allMessages = allMessages.filter(m => m.id !== deleteTargetId);
        showToast('✅ تم الحذف', 'success');
        closeModal('deleteModal');
        deleteTargetId = null;
        updateStats();
        applyFilters();

      } catch (error) {
        console.error(error);
        showToast('فشل الحذف', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-trash"></i> حذف';
      }
    });

    // ============================================
    // EVENTS
    // ============================================
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('typeFilter').addEventListener('change', applyFilters);
    document.getElementById('statusFilter').addEventListener('change', applyFilters);

    ['viewModal', 'deleteModal'].forEach(id => {
      document.getElementById(id).addEventListener('click', function (e) {
        if (e.target === this) closeModal(id);
      });
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal('viewModal');
        closeModal('deleteModal');
      }
    });

    // Start
    loadMessages();

    console.log('✅ صفحة الرسائل جاهزة');
  </script>
