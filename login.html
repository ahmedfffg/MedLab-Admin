<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - معمل ميدلاب</title>
    <link href="../images/logo.png" type="image/x-icon" rel="icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a4179 0%, #499bda 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
        }

        .login-card {
            position: relative;
            z-index: 2;
            background: white;
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            padding: 45px 40px;
            width: 100%;
            max-width: 440px;
            animation: cardIn 0.5s ease;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 18px;
            border-radius: 22px;
            background: linear-gradient(135deg, #0a4179, #499bda);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            box-shadow: 0 10px 25px rgba(10, 65, 121, 0.35);
        }

        .login-title {
            text-align: center;
            font-size: 1.7rem;
            font-weight: 900;
            color: #0a4179;
            margin-bottom: 6px;
        }

        .login-subtitle {
            text-align: center;
            color: #6d8fa3;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-size: 13.5px;
            font-weight: 700;
            color: #143a52;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .form-group label i {
            color: #0a7cb8;
            font-size: 13px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 46px 14px 16px;
            border: 2px solid #e8ecf0;
            border-radius: 12px;
            background: #f8fafc;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: #143a52;
            outline: none;
            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #0a7cb8;
            background: white;
            box-shadow: 0 0 0 4px rgba(10, 124, 184, 0.08);
        }

        .input-wrapper .input-icon {
            position: absolute;
            right: 16px;
            color: #a0aab5;
            font-size: 16px;
            pointer-events: none;
        }

        .toggle-password {
            position: absolute;
            left: 14px;
            background: none;
            border: none;
            color: #a0aab5;
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
            transition: 0.2s;
        }

        .toggle-password:hover {
            color: #0a7cb8;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13.5px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .alert.show { display: flex; animation: shake 0.4s; }
        .alert.error {
            background: #fdecea;
            color: #c0392b;
            border-right: 3px solid #c0392b;
        }
        .alert.success {
            background: #e8f8ef;
            color: #1a7d4a;
            border-right: 3px solid #1a7d4a;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0a4179, #499bda);
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px -6px rgba(10, 65, 121, 0.5);
            transition: 0.25s;
            margin-top: 6px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px -6px rgba(10, 65, 121, 0.6);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-info {
            margin-top: 24px;
            padding: 14px 16px;
            background: #f0f9ff;
            border-radius: 10px;
            border-right: 3px solid #0a7cb8;
            font-size: 12.5px;
            color: #3c6478;
            line-height: 1.8;
        }

        .login-info strong {
            color: #085a87;
            font-weight: 700;
        }

        .login-info code {
            background: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            color: #0a4179;
            font-weight: 700;
            font-size: 12px;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #6d8fa3;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            .login-title {
                font-size: 1.4rem;
            }

            .login-logo {
                width: 68px;
                height: 68px;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="login-logo">
            <i class="fas fa-flask"></i>
        </div>

        <h1 class="login-title">معمل ميدلاب</h1>
        <p class="login-subtitle">نظام إدارة المعمل - تسجيل الدخول</p>

        <div class="alert" id="alertBox"></div>

        <form id="loginForm" autocomplete="off">

            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i>
                    اسم المستخدم
                </label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" value="admin" required>
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    كلمة المرور
                </label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required autofocus>
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="toggle-password" id="togglePassword" title="إظهار/إخفاء">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                تسجيل الدخول
            </button>

        </form>
        
        <div class="login-footer">
            © 2026 معمل ميدلاب. جميع الحقوق محفوظة.
        </div>

    </div>

    <script>
    (function () {
        'use strict';

        const $ = id => document.getElementById(id);

        // بيانات الدخول (يمكن تعديلها)
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = '123';

        const form = $('loginForm');
        const usernameInput = $('username');
        const passwordInput = $('password');
        const loginBtn = $('loginBtn');
        const alertBox = $('alertBox');
        const togglePassword = $('togglePassword');

        // لو مسجل دخول بالفعل → انتقل لـ index
        if (sessionStorage.getItem('medlab_admin_logged_in') === '1') {
            window.location.href = 'index.html';
            return;
        }

        // إظهار/إخفاء كلمة المرور
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;

            const icon = this.querySelector('i');
            icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        function showAlert(msg, type) {
            alertBox.className = 'alert ' + type + ' show';
            alertBox.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;

            if (type === 'error') {
                setTimeout(() => {
                    alertBox.classList.remove('show');
                }, 4000);
            }
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // مسح أي رسالة قديمة
            alertBox.classList.remove('show');

            if (!username || !password) {
                showAlert('الرجاء ملء جميع الحقول', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

            // محاكاة تحقق (يمكن استبدالها بـ API call لاحقاً)
            setTimeout(() => {
                if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                    // نجاح
                    sessionStorage.setItem('medlab_admin_logged_in', '1');
                    sessionStorage.setItem('medlab_admin_username', username);
                    sessionStorage.setItem('medlab_login_time', new Date().toISOString());

                    showAlert('✅ تم تسجيل الدخول بنجاح، جاري التحويل...', 'success');

                    loginBtn.innerHTML = '<i class="fas fa-check"></i> تم بنجاح';

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800);

                } else {
                    // فشل
                    showAlert('❌ بيانات الدخول غير صحيحة', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }, 600);
        });

        console.log('✅ Login page ready');
    })();
    </script>

</body>
</html>
