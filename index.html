  /* gentle top darkening so the button bar reads cleanly on any part of the photo */
  .stage::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(to bottom,
                rgba(2,8,20,0.55) 0%,
                rgba(2,8,20,0.30) 12%,
                rgba(2,8,20,0.05) 26%,
                rgba(2,8,20,0.00) 40%,
                rgba(2,8,20,0.18) 100%);
    pointer-events:none;
  }

  /* ===================== BUTTON GRID ===================== */
  .buttons-wrap{
    position:absolute;
    top: 2.2%;
    left: 1.4%;
    right: 1.4%;
    display:flex;
    flex-direction:column;
    gap: 1.3%;
    z-index:5;
  }

  .btn-row{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.3%;
  }

  .lab-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: clamp(6px, 1vw, 14px);
    background: var(--panel-bg);
    border: 1.5px solid var(--panel-border);
    border-radius: clamp(8px, 1.1vw, 16px);
    color: var(--text-white);
    font-size: clamp(11px, 1.55vw, 22px);
    font-weight: 700;
    padding: clamp(8px, 1.6vw, 22px) clamp(6px, 1vw, 16px);
    cursor: pointer;
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    transition: transform .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease;
    white-space: nowrap;
    text-shadow: 0 0 10px rgba(90,170,255,0.35);
    outline:none;
  }

  .lab-btn svg{
    width: clamp(16px, 2.1vw, 30px);
    height: clamp(16px, 2.1vw, 30px);
    stroke: #ffffff;
    fill:none;
    stroke-width: 1.7;
    flex-shrink:0;
    filter: drop-shadow(0 0 4px rgba(150,200,255,0.5));
  }

  .lab-btn:hover, .lab-btn:focus-visible{
    background: var(--panel-bg-hover);
    border-color: var(--panel-border-hover);
    transform: translateY(-3px);
    box-shadow: 0 8px 26px rgba(30,110,220,0.45), 0 0 0 1px rgba(150,200,255,0.15) inset;
  }

  .lab-btn:active{
    transform: translateY(-1px) scale(0.98);
  }

  /* ===================== TITLE ===================== */
  .title-wrap{
    position:absolute;
    top: 66%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align:center;
    z-index:4;
    pointer-events:none;
    width: 92%;
  }

  .title-main{
    font-size: clamp(30px, 7.4vw, 108px);
    font-weight: 900;
    color:#ffffff;
    letter-spacing: 2px;
    line-height:1;
    text-shadow:
      0 0 10px rgba(255,255,255,0.85),
      0 0 26px rgba(100,180,255,0.9),
      0 0 55px rgba(50,140,255,0.75),
      0 0 90px rgba(30,110,255,0.55);
  }

  .title-sub{
    margin-top: clamp(6px, 1.4vw, 18px);
    font-size: clamp(14px, 2.7vw, 38px);
    font-weight: 700;
    color:#ffffff;
    letter-spacing: 1px;
    text-shadow:
      0 0 8px rgba(255,255,255,0.75),
      0 0 20px rgba(100,180,255,0.85),
      0 0 42px rgba(40,120,255,0.6);
  }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 640px){
    .lab-btn{ font-size: clamp(9px, 2.6vw, 13px); }
    .lab-btn span{ display:none; }
    .lab-btn svg{ width:20px; height:20px; }
    .buttons-wrap{ gap: 1.8%; }
    .btn-row{ gap: 1.8%; }
  }

  @media (min-width: 641px) and (max-width: 900px){
    .lab-btn span{ display:inline; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;
  }
  

  /* ===================== UNIVERSAL RESPONSIVE OVERRIDES ===================== */
  /* These rules only adapt sizing/layout to the available viewport. */

  html{
    min-width:0;
    min-height:100%;
  }

  body{
    min-width:0;
    min-height:100vh;
    min-height:100dvh;
    overflow:auto;
  }

  .stage{
    width:100%;
    max-width:1600px;
    max-height:none;
  }

  /* Very small screens and portrait/foldable phones */
  @media (max-width: 640px) and (orientation: portrait){
    body{
      padding: max(6px, env(safe-area-inset-top))
               max(6px, env(safe-area-inset-right))
               max(6px, env(safe-area-inset-bottom))
               max(6px, env(safe-area-inset-left));
    }

    .stage{
      width:100%;
      height:calc(100dvh - max(12px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      min-height:0;
      aspect-ratio:auto;
      border-radius:clamp(8px, 2.5vw, 14px);
    }

    .buttons-wrap{
      top:clamp(8px, 2.2%, 18px);
      left:clamp(7px, 2.2%, 18px);
      right:clamp(7px, 2.2%, 18px);
      gap:clamp(7px, 1.8vh, 14px);
    }

    .btn-row{
      gap:clamp(6px, 1.8vw, 12px);
    }

    .lab-btn{
      min-width:0;
      min-height:clamp(40px, 7.5vh, 64px);
      padding:clamp(6px, 1.6vh, 12px) clamp(4px, 1.5vw, 10px);
      gap:clamp(4px, 1vw, 8px);
      font-size:clamp(8px, 2.6vw, 13px);
      border-radius:clamp(7px, 2vw, 13px);
    }

    .lab-btn svg{
      width:clamp(16px, 5vw, 23px);
      height:clamp(16px, 5vw, 23px);
    }

    .title-wrap{
      top:clamp(58%, 66%, 70%);
      width:94%;
    }

    .title-main{
      font-size:clamp(28px, 13vw, 62px);
      letter-spacing:clamp(0px, .5vw, 2px);
    }

    .title-sub{
      margin-top:clamp(5px, 1.5vh, 11px);
      font-size:clamp(12px, 5vw, 25px);
      letter-spacing:clamp(0px, .3vw, 1px);
    }
  }

  /* Extra-small foldable cover/narrow screens */
  @media (max-width: 360px) and (orientation: portrait){
    body{
      padding:4px;
    }

    .stage{
      height:calc(100dvh - 8px);
      border-radius:8px;
    }

    .buttons-wrap{
      top:7px;
      left:6px;
      right:6px;
      gap:7px;
    }

    .btn-row{
      gap:5px;
    }

    .lab-btn{
      min-height:38px;
      padding:5px 3px;
      border-radius:7px;
    }

    .lab-btn svg{
      width:17px;
      height:17px;
    }

    .title-wrap{
      width:96%;
    }

    .title-main{
      font-size:clamp(24px, 14vw, 48px);
    }

    .title-sub{
      font-size:clamp(11px, 5.2vw, 20px);
    }
  }

  /* Small landscape phones and foldables */
  @media (max-width: 900px) and (orientation: landscape){
    body{
      padding: max(6px, env(safe-area-inset-top))
               max(6px, env(safe-area-inset-right))
               max(6px, env(safe-area-inset-bottom))
               max(6px, env(safe-area-inset-left));
    }

    .stage{
      width:100%;
      height:calc(100dvh - max(12px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      aspect-ratio:auto;
      border-radius:clamp(8px, 1.5vw, 14px);
    }

    .buttons-wrap{
      top:2.2%;
      left:1.4%;
      right:1.4%;
      gap:1.2%;
    }

    .btn-row{
      gap:1.2%;
    }

    .lab-btn{
      min-width:0;
      min-height:0;
      padding:clamp(5px, 1.2vh, 11px) clamp(5px, .8vw, 12px);
      font-size:clamp(9px, 1.7vw, 16px);
      border-radius:clamp(7px, 1.1vw, 13px);
    }

    .lab-btn svg{
      width:clamp(16px, 2.4vw, 24px);
      height:clamp(16px, 2.4vw, 24px);
    }

    .title-wrap{
      width:92%;
    }

    .title-main{
      font-size:clamp(28px, 7.4vw, 76px);
    }

    .title-sub{
      font-size:clamp(13px, 2.7vw, 28px);
    }
  }

  /* Tablets / medium screens */
  @media (min-width: 641px) and (max-width: 1200px) and (orientation: portrait){
    body{
      padding:12px;
    }

    .stage{
      width:100%;
      height:calc(100dvh - 24px);
      aspect-ratio:auto;
    }

    .lab-btn{
      min-width:0;
      font-size:clamp(11px, 2vw, 18px);
      padding:clamp(8px, 1.5vh, 15px) clamp(7px, 1vw, 14px);
    }
  }

  /* Large displays / TV: use the available area while retaining the original proportions */
  @media (min-width: 1601px){
    .stage{
      width:min(100%, 1600px);
    }
  }

  /* Devices with a safe-area (notches, rounded corners, foldables) */
  @supports (padding: max(0px)){
    body{
      padding-top:max(12px, env(safe-area-inset-top));
      padding-right:max(12px, env(safe-area-inset-right));
      padding-bottom:max(12px, env(safe-area-inset-bottom));
      padding-left:max(12px, env(safe-area-inset-left));
    }
  }

  /* Prevent horizontal overflow caused by very long Arabic labels */
  @media (max-width: 640px){
    .lab-btn{
      overflow:hidden;
      text-overflow:ellipsis;
    }
  }

<script>
  document.querySelectorAll('.lab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var action = btn.getAttribute('data-action');
      btn.style.transform = 'translateY(-1px) scale(0.96)';
      setTimeout(function(){ btn.style.transform = ''; }, 140);
      console.log('MedLab action clicked:', action);
    });
  });

  document.querySelectorAll('.lab-btn').forEach(button => {

  button.addEventListener('click', function () {

    const action = this.dataset.action;

    switch (action) {
      
      case 'الحجوزات':
        window.location.href = 'admin-patients.html';
        break;

  case 'اضافة مريض لرفع النتائج':
        window.location.href = 'add-patient-forwebsite.html';
        break;

      case 'التحاليل':
        window.location.href = 'tests.html';
        break;  

         case 'الباقات والعروض':
        window.location.href = 'admin-packages.html';
        break;

      case 'الرسائل':
        window.location.href = 'messages.html';
        break;

 case 'رفع نتيجة مريض PDF':
        window.location.href = 'upload-result.html';
        break;  

      case 'عن الموقع':
        window.location.href = 'about.html';
        break;

      case 'عن ادارة الموقع':
        window.location.href = 'admin-about.html';
        break;

      default:
        console.log('لا توجد صفحة مرتبطة بهذا الزر:', action);

    }

  });

});
</script>
