<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0788c7">
  <meta name="description" content="رفع نتيجة - معمل ميدلاب">

  <title>رفع نتيجة - معمل ميدلاب</title>

  <link href="logo.png" type="image/x-icon" rel="icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>

    /* =========================================================
       MEDLAB — PREMIUM MEDICAL UI
       رفع نتيجة — تصميم طبي احترافي متجاوب بالكامل
    ========================================================= */

    :root {
      --primary: #0788c7;
      --primary-dark: #056b9d;
      --primary-deep: #075579;
      --primary-light: #42b6e8;

      --cyan: #08a9d6;
      --cyan-soft: #e8faff;

      --blue-soft: #eaf7fd;
      --blue-softer: #f7fcff;

      --white: #ffffff;

      --border: #dcecf4;
      --border-light: #edf5f9;

      --text-dark: #14394d;
      --text-medium: #486879;
      --text-light: #7893a2;

      --success: #16834d;
      --success-soft: #e9f8f0;

      --danger: #d13f35;
      --danger-soft: #fff0ee;

      --warning: #d98408;
      --warning-soft: #fff7e8;

      --purple: #7054b5;
      --purple-soft: #f3efff;

      --shadow-xs: 0 2px 8px rgba(15,80,110,.05);
      --shadow: 0 10px 30px rgba(17,88,120,.08);
      --shadow-hover: 0 16px 40px rgba(17,88,120,.13);
      --shadow-lg: 0 24px 60px rgba(17,88,120,.16);

      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 22px;
      --radius-xl: 30px;

      --transition: .25s cubic-bezier(.4,0,.2,1);
      --transition-slow: .45s cubic-bezier(.4,0,.2,1);

      --topbar-h: 72px;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 100% 0%, rgba(66,182,232,.10), transparent 30%),
        radial-gradient(circle at 0% 100%, rgba(8,169,214,.07), transparent 28%),
        radial-gradient(circle at 50% 50%, rgba(7,136,199,.03), transparent 60%),
        #f2f9fc;
      color: var(--text-dark);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(120deg, rgba(255,255,255,.4), transparent 40%);
      z-index: -1;
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(66,182,232,.06), transparent 70%);
      top: -200px;
      left: -200px;
      pointer-events: none;
      z-index: -1;
      animation: orbFloat 20s ease-in-out infinite;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(80px, 60px) scale(1.15); }
    }

    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .hidden { display: none !important; }

    ::selection { background: var(--primary-light); color: white; }


    /* =========================================================
       TOPBAR
    ========================================================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      min-height: var(--topbar-h);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(216,232,242,.8);
      box-shadow: 0 4px 24px rgba(15,70,100,.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px clamp(14px, 3vw, 42px);
      transition: var(--transition);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      min-width: 0;
      transition: var(--transition);
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 8px 20px rgba(7,136,199,.25);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .brand-logo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,.3), transparent);
      transform: translateX(-100%);
      transition: transform .6s ease;
    }

    .brand:hover .brand-logo::after { transform: translateX(100%); }

    .brand:hover .brand-logo {
      transform: translateY(-2px) rotate(-3deg);
      box-shadow: 0 12px 28px rgba(7,136,199,.32);
    }

    .brand-text { min-width: 0; }

    .brand-text h1 {
      color: var(--primary-deep);
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      line-height: 1.2;
      white-space: nowrap;
      font-weight: 800;
    }

    .brand-text span {
      color: var(--text-light);
      font-size: 12px;
      display: block;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .top-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.9);
      color: var(--primary-dark);
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-decoration: none;
      transition: var(--transition);
      box-shadow: var(--shadow-xs);
    }

    .top-btn:hover {
      background: var(--blue-soft);
      border-color: rgba(7,136,199,.35);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(7,136,199,.12);
    }

    .top-btn:active { transform: translateY(0); }


    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      width: min(1000px, 100%);
      margin: 0 auto;
      padding: clamp(22px, 4vw, 42px) clamp(14px, 3vw, 30px) 80px;
    }


    /* =========================================================
       PAGE HEAD
    ========================================================= */

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 26px;
      padding: clamp(20px, 3vw, 28px);
      border: 1px solid rgba(220,236,244,.9);
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(255,255,255,.98), rgba(247,252,255,.96));
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .page-head::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      left: -90px;
      top: -110px;
      background: radial-gradient(circle, rgba(66,182,232,.14), transparent 70%);
      pointer-events: none;
    }

    .page-head::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      right: -50px;
      bottom: -70px;
      background: radial-gradient(circle, rgba(8,169,214,.08), transparent 70%);
      pointer-events: none;
    }

    .page-head > div {
      position: relative;
      z-index: 1;
    }

    .page-head h2 {
      color: var(--primary-deep);
      font-size: clamp(1.35rem, 2.5vw, 1.95rem);
      font-weight: 800;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-head h2 i {
      color: var(--primary);
      font-size: .9em;
    }

    .page-head p {
      color: var(--text-light);
      font-size: clamp(13px, 1.5vw, 14.5px);
    }


    /* =========================================================
       CARD
    ========================================================= */

    .card {
      background: rgba(255,255,255,.97);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: clamp(20px, 3vw, 30px);
      margin-bottom: 20px;
      transition: var(--transition);
      animation: cardIn .4s ease backwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      border-color: rgba(7,136,199,.15);
    }

    .card h3 {
      color: var(--primary-deep);
      font-size: clamp(1rem, 2vw, 1.15rem);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--blue-soft);
      position: relative;
    }

    .card h3::before {
      content: "";
      position: absolute;
      bottom: -2px;
      right: 0;
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 2px;
    }

    .card h3 i {
      color: var(--primary);
      width: 34px;
      height: 34px;
      background: var(--blue-soft);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }


    /* =========================================================
       FORM
    ========================================================= */

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .form-group label i {
      color: var(--primary);
      font-size: 12px;
      width: 14px;
      text-align: center;
    }

    .form-group label .required { color: var(--danger); }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 13px;
      background: var(--blue-softer);
      font-family: inherit;
      font-size: 14.5px;
      outline: none;
      transition: var(--transition);
      color: var(--text-dark);
      min-height: 48px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(7,136,199,.08);
    }

    .form-group small {
      color: var(--text-light);
      font-size: 12px;
      font-weight: 600;
    }

    textarea { resize: vertical; min-height: 85px; }


    /* =========================================================
       SEARCH ROW
    ========================================================= */

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .search-row .form-group { margin-bottom: 0; }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .btn {
      padding: 13px 22px;
      border-radius: 13px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      min-height: 48px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      box-shadow: 0 8px 22px rgba(7,136,199,.28);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,.25), transparent);
      transform: translateX(-100%);
      transition: transform .6s ease;
    }

    .btn-primary:hover::after { transform: translateX(100%); }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(7,136,199,.35);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-primary:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-ghost {
      background: var(--blue-soft);
      color: var(--primary-dark);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: var(--blue-softer);
      transform: translateY(-1px);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success), #22a05f);
      color: white;
      box-shadow: 0 8px 22px rgba(22,131,77,.28);
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(22,131,77,.35);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: white;
      transform: translateY(-1px);
    }

    .btn-block { width: 100%; }
    .btn-sm { padding: 9px 14px; font-size: 12.5px; min-height: 40px; border-radius: 10px; }


    /* =========================================================
       PATIENT INFO
    ========================================================= */

    .patient-info {
      background: linear-gradient(135deg, var(--blue-soft), var(--blue-softer));
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .patient-info .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-medium);
      min-width: 0;
    }

    .patient-info .info-item i {
      color: var(--primary);
      width: 32px;
      height: 32px;
      background: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      box-shadow: var(--shadow-xs);
    }

    .patient-info .info-item strong {
      color: var(--primary-deep);
      font-weight: 800;
      word-break: break-word;
    }


    /* =========================================================
       FILE DROP
    ========================================================= */

    .file-drop {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 34px 24px;
      text-align: center;
      background: var(--blue-softer);
      transition: var(--transition);
      cursor: pointer;
      display: block;
      position: relative;
      overflow: hidden;
    }

    .file-drop::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(66,182,232,.06), transparent 70%);
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    .file-drop:hover::before,
    .file-drop.dragover::before { opacity: 1; }

    .file-drop:hover,
    .file-drop.dragover {
      border-color: var(--primary);
      background: var(--blue-soft);
      transform: translateY(-2px);
    }

    .file-drop input { display: none; }

    .file-drop i {
      font-size: 42px;
      color: var(--primary);
      margin-bottom: 12px;
      display: block;
      transition: var(--transition);
    }

    .file-drop:hover i,
    .file-drop.dragover i {
      transform: translateY(-4px) scale(1.08);
    }

    .file-drop .title {
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 5px;
      font-size: 14.5px;
    }

    .file-drop .sub {
      font-size: 12.5px;
      color: var(--text-light);
      font-weight: 600;
    }

    .file-name {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--success-soft), #d4f0e1);
      border-radius: 12px;
      font-size: 13.5px;
      color: var(--success);
      font-weight: 800;
      border: 1px solid rgba(22,131,77,.15);
    }

    .file-name.show {
      display: flex;
      align-items: center;
      gap: 10px;
      animation: cardIn .3s ease;
    }

    .file-name i { font-size: 16px; }


    /* =========================================================
       ALERT
    ========================================================= */

    .alert {
      padding: 14px 18px;
      border-radius: 13px;
      margin-bottom: 16px;
      font-size: 13.5px;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 10px;
      animation: fadeIn .3s ease;
    }

    .alert.show { display: flex; }

    .alert i { font-size: 16px; flex-shrink: 0; }

    .alert.success {
      background: linear-gradient(135deg, var(--success-soft), #d4f0e1);
      color: var(--success);
      border-right: 4px solid var(--success);
    }

    .alert.error {
      background: linear-gradient(135deg, var(--danger-soft), #ffdedb);
      color: var(--danger);
      border-right: 4px solid var(--danger);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }


    /* =========================================================
       RECENT UPLOADS
    ========================================================= */

    .recent-uploads {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 450px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #b7d8e8 #f3f9fc;
      padding-right: 4px;
    }

    .recent-uploads::-webkit-scrollbar { width: 6px; }
    .recent-uploads::-webkit-scrollbar-track { background: #f3f9fc; }
    .recent-uploads::-webkit-scrollbar-thumb {
      background: #b7d8e8;
      border-radius: 20px;
    }

    .upload-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: linear-gradient(135deg, #f9fdff, #f3faff);
      border-radius: 14px;
      border: 1.5px solid var(--border);
      gap: 12px;
      transition: var(--transition);
      animation: cardIn .3s ease backwards;
    }

    .upload-item:hover {
      border-color: rgba(7,136,199,.25);
      background: white;
      transform: translateX(-3px);
      box-shadow: 0 10px 26px rgba(7,136,199,.10);
    }

    .upload-item .info {
      flex: 1;
      min-width: 0;
    }

    .upload-item .info .fname {
      font-weight: 800;
      color: var(--text-dark);
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .upload-item .info .fmeta {
      font-size: 11.5px;
      color: var(--text-light);
      font-weight: 600;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .upload-item .info .fmeta i {
      color: var(--primary);
      margin-left: 3px;
    }

    .upload-item .item-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .empty-mini {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-light);
      font-size: 13.5px;
      font-weight: 600;
    }

    .empty-mini i {
      display: block;
      font-size: 40px;
      color: #cfe2eb;
      margin-bottom: 10px;
      animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }


    /* =========================================================
       PREVIEW MODAL
    ========================================================= */

    .preview-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5,40,60,.65);
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity .25s ease;
    }

    .preview-overlay.show {
      display: flex;
      opacity: 1;
    }

    .preview-modal {
      background: white;
      border-radius: 22px;
      width: 100%;
      max-width: 1100px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 100px rgba(0,0,0,.4);
      overflow: hidden;
      animation: modalIn .35s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(24px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .preview-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      background: linear-gradient(180deg, #ffffff, #fbfdfe);
    }

    .preview-header .preview-title {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .preview-header .preview-title i {
      color: var(--primary);
      font-size: 24px;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      background: var(--blue-soft);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-header .preview-title .t-info {
      min-width: 0;
      flex: 1;
    }

    .preview-header .preview-title .t-info h3 {
      color: var(--primary-deep);
      font-size: 1.05rem;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 800;
    }

    .preview-header .preview-title .t-info p {
      color: var(--text-light);
      font-size: 12.5px;
      font-weight: 600;
    }

    .preview-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preview-body {
      flex: 1;
      overflow: hidden;
      background: #f0f2f5;
      position: relative;
    }

    .preview-body iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .preview-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 15px;
      background: white;
      z-index: 5;
      transition: opacity .3s ease;
    }

    .preview-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .preview-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-right-color: var(--primary-light);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .preview-loading p {
      color: var(--text-light);
      font-size: 13.5px;
      font-weight: 600;
    }

    .preview-info-bar {
      padding: 12px 24px;
      background: linear-gradient(180deg, #fbfdfe, #ffffff);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--text-light);
      font-weight: 600;
    }

    .preview-info-bar .info-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .preview-info-bar .info-chip i {
      color: var(--primary);
      width: 24px;
      height: 24px;
      background: var(--blue-soft);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .preview-info-bar .info-chip strong {
      color: var(--text-dark);
      font-weight: 800;
    }


    /* =========================================================
       RESPONSIVE — VERY LARGE SCREENS
    ========================================================= */

    @media (min-width: 2200px) {
      :root { --topbar-h: 88px; }

      .page { max-width: 1400px; padding-left: 60px; padding-right: 60px; }

      .brand-logo { width: 58px; height: 58px; font-size: 26px; border-radius: 18px; }
      .brand-text h1 { font-size: 1.5rem; }
      .brand-text span { font-size: 14px; }

      .top-btn { min-height: 48px; padding: 12px 22px; font-size: 15px; border-radius: 14px; }

      .page-head { padding: 36px; }
      .page-head h2 { font-size: 2.4rem; }
      .page-head p { font-size: 17px; }

      .card { padding: 40px; }
      .card h3 { font-size: 1.5rem; margin-bottom: 24px; }
      .card h3 i { width: 44px; height: 44px; font-size: 18px; }

      .form-group { margin-bottom: 22px; gap: 10px; }
      .form-group label { font-size: 15.5px; }

      .form-group input,
      .form-group select,
      .form-group textarea {
        padding: 18px 22px;
        font-size: 16px;
        min-height: 58px;
        border-radius: 15px;
      }

      .btn { padding: 18px 32px; font-size: 17px; min-height: 58px; border-radius: 16px; }

      .patient-info { padding: 28px; gap: 20px; }
      .patient-info .info-item { font-size: 16px; }
      .patient-info .info-item i { width: 42px; height: 42px; font-size: 16px; border-radius: 13px; }

      .file-drop { padding: 50px 30px; border-radius: 20px; }
      .file-drop i { font-size: 56px; }
      .file-drop .title { font-size: 17px; }
      .file-drop .sub { font-size: 15px; }

      .upload-item { padding: 20px 24px; border-radius: 16px; }
      .upload-item .info .fname { font-size: 16px; }
      .upload-item .info .fmeta { font-size: 14px; }
      .btn-sm { padding: 13px 20px; font-size: 14px; min-height: 46px; }

      .preview-modal { max-width: 1500px; }
      .preview-header { padding: 24px 32px; }
      .preview-header .preview-title i { width: 58px; height: 58px; font-size: 28px; border-radius: 16px; }
      .preview-header .preview-title .t-info h3 { font-size: 1.3rem; }
      .preview-header .preview-title .t-info p { font-size: 15px; }
    }


    @media (min-width: 1600px) and (max-width: 2199px) {
      .page { max-width: 1200px; }
      .card { padding: 32px; }
    }


    /* =========================================================
       RESPONSIVE — TABLETS
    ========================================================= */

    @media (max-width: 900px) {
      .search-row { grid-template-columns: 1fr; }
      .search-row .form-group { margin-bottom: 10px; }
      .search-row .btn { width: 100%; }

      .patient-info { grid-template-columns: 1fr; }
    }


    /* =========================================================
       RESPONSIVE — MOBILE
    ========================================================= */

    @media (max-width: 700px) {
      :root { --topbar-h: 62px; }

      .topbar { min-height: var(--topbar-h); padding: 8px 12px; gap: 10px; }

      .brand-logo { width: 40px; height: 40px; border-radius: 12px; font-size: 17px; }
      .brand-text span { display: none; }
      .brand-text h1 { font-size: 1rem; }

      .top-actions { gap: 5px; }

      .top-btn {
        width: 40px;
        min-height: 40px;
        padding: 0;
        border-radius: 11px;
      }

      .top-btn span { display: none; }

      .page { padding: 16px 12px 55px; }

      .page-head { padding: 20px; border-radius: 20px; gap: 16px; flex-direction: column; align-items: flex-start; }
      .page-head h2 { font-size: 1.3rem; }
      .page-head p { font-size: 12.5px; }

      .card { padding: 18px; border-radius: 20px; margin-bottom: 16px; }
      .card h3 { font-size: 1rem; margin-bottom: 14px; }
      .card h3 i { width: 30px; height: 30px; font-size: 13px; }

      .form-group { margin-bottom: 14px; gap: 6px; }
      .form-group label { font-size: 12.5px; }

      .form-group input,
      .form-group select,
      .form-group textarea {
        padding: 11px 14px;
        font-size: 13.5px;
        min-height: 46px;
        border-radius: 11px;
      }

      .btn { padding: 12px 20px; font-size: 13.5px; min-height: 46px; border-radius: 11px; }
      .btn-sm { padding: 8px 12px; font-size: 11.5px; min-height: 38px; }

      .patient-info { padding: 16px; gap: 10px; }
      .patient-info .info-item { font-size: 13px; }
      .patient-info .info-item i { width: 28px; height: 28px; font-size: 12px; }

      .file-drop { padding: 26px 18px; }
      .file-drop i { font-size: 34px; margin-bottom: 10px; }
      .file-drop .title { font-size: 13px; }
      .file-drop .sub { font-size: 11.5px; }

      .alert { padding: 12px 14px; font-size: 12.5px; }

      .upload-item { padding: 12px 14px; flex-direction: column; align-items: stretch; gap: 10px; border-radius: 12px; }
      .upload-item .info .fname { font-size: 12.5px; }
      .upload-item .info .fmeta { font-size: 11px; }
      .upload-item .item-actions { justify-content: flex-end; }

      .preview-overlay { padding: 0; }
      .preview-modal { border-radius: 0; height: 100vh; max-height: 100vh; }

      .preview-header { padding: 14px 16px; }
      .preview-header .preview-title i { width: 42px; height: 42px; font-size: 20px; }
      .preview-header .preview-title .t-info h3 { font-size: .95rem; }
      .preview-header .preview-title .t-info p { font-size: 11.5px; }
      .preview-actions { width: 100%; justify-content: flex-end; }
      .preview-info-bar { padding: 10px 16px; gap: 12px; font-size: 11.5px; }
    }


    /* =========================================================
       RESPONSIVE — VERY SMALL PHONES
    ========================================================= */

    @media (max-width: 420px) {
      .page-head h2 { font-size: 1.15rem; }
      .card { padding: 15px; }

      .upload-item .item-actions { width: 100%; }
      .upload-item .item-actions .btn { flex: 1; }

      .preview-actions { gap: 5px; }
      .preview-actions .btn { flex: 1; padding: 8px; font-size: 11px; }
    }


    @media (max-width: 360px) {
      .page { padding-left: 8px; padding-right: 8px; }
      .topbar { padding-left: 8px; padding-right: 8px; }

      .brand { gap: 8px; }
      .brand-logo { width: 36px; height: 36px; font-size: 15px; border-radius: 10px; }
      .brand-text h1 { font-size: .9rem; }

      .top-btn { width: 36px; min-height: 36px; border-radius: 10px; }

      .card { padding: 13px; }
    }


    @media (max-width: 320px) {
      .page { padding-left: 6px; padding-right: 6px; }
      .topbar { padding-left: 6px; padding-right: 6px; }

      .brand { gap: 6px; }
      .brand-logo { width: 34px; height: 34px; font-size: 14px; border-radius: 9px; }
      .brand-text h1 { font-size: .85rem; }

      .top-btn { width: 34px; min-height: 34px; }
    }


    /* =========================================================
       REDUCE MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }


    /* =========================================================
       PRINT
    ========================================================= */

    @media print {
      .topbar, .preview-header, .preview-actions, .page-head {
        display: none !important;
      }
      body { background: white; }
      .preview-modal { box-shadow: none; border-radius: 0; }
      .preview-info-bar { display: none; }
    }

  </style>
</head>

<body>

  <!-- =======================================================
       TOPBAR
  ======================================================= -->

  <header class="topbar">

    <a href="index.html" class="brand">
      <div class="brand-logo">
        <i class="fas fa-file-upload"></i>
      </div>
      <div class="brand-text">
        <h1>معمل ميدلاب</h1>
        <span>رفع النتائج</span>
      </div>
    </a>

    <div class="top-actions">
      <a href="admin-patients.html" class="top-btn" title="إدارة المرضى">
        <i class="fas fa-users"></i>
        <span>إدارة المرضى</span>
      </a>
    </div>

  </header>


  <!-- =======================================================
       MAIN
  ======================================================= -->

  <main class="page">

    <div class="page-head">
      <div>
        <h2>
          <i class="fas fa-file-upload"></i>
          رفع نتيجة جديدة
        </h2>
        <p>
          ارفع ملف PDF لمريض مسجل بالكود أو الهاتف الخاص به
        </p>
      </div>
    </div>


    <!-- =====================================================
         الخطوة 1: البحث عن المريض
    ====================================================== -->

    <div class="card">
      <h3>
        <i class="fas fa-search"></i>
        الخطوة 1: ابحث عن المريض
      </h3>

      <div class="search-row">
        <div class="form-group">
          <label for="searchCode">
            <i class="fas fa-id-card"></i>
            كود المريض أو الهاتف <span class="required">*</span>
          </label>
          <input type="text" id="searchCode" placeholder="مثال: P02024614 أو 01061730854">
        </div>
        <button class="btn btn-primary" id="searchBtn" type="button">
          <i class="fas fa-search"></i>
          بحث
        </button>
      </div>

      <div class="alert" id="searchAlert"></div>
    </div>


    <!-- =====================================================
         الخطوة 2: رفع النتيجة (تظهر بعد اختيار المريض)
    ====================================================== -->

    <div id="uploadSection" class="hidden">

      <div class="card">
        <h3>
          <i class="fas fa-user-check"></i>
          المريض المحدد
        </h3>
        <div class="patient-info" id="patientInfoBox"></div>
      </div>

      <div class="card">
        <h3>
          <i class="fas fa-cloud-upload-alt"></i>
          الخطوة 2: ارفع الملف
        </h3>

        <div class="alert" id="uploadAlert"></div>

        <form id="uploadForm">

          <div class="form-group">
            <label for="fileName">
              <i class="fas fa-file-alt"></i>
              اسم التحليل المعروض <span class="required">*</span>
            </label>
            <input type="text" id="fileName" placeholder="مثال: تحليل صورة دم كاملة" required>
          </div>

          <div class="form-group">
            <label for="testType">
              <i class="fas fa-flask"></i>
              نوع التحليل (اختياري)
            </label>
            <input type="text" id="testType" placeholder="مثال: CBC">
          </div>

          <div class="form-group">
            <label for="resultDate">
              <i class="fas fa-calendar"></i>
              تاريخ النتيجة <span class="required">*</span>
            </label>
            <input type="date" id="resultDate" required>
          </div>

          <div class="form-group">
            <label for="notes">
              <i class="fas fa-sticky-note"></i>
              ملاحظات (اختياري)
            </label>
            <textarea id="notes" rows="2" placeholder="أي ملاحظات إضافية..."></textarea>
          </div>

          <div class="form-group">
            <label>
              <i class="fas fa-file-pdf"></i>
              ملف النتيجة PDF <span class="required">*</span>
            </label>
            <label for="pdfFile" class="file-drop" id="fileDrop">
              <input type="file" id="pdfFile" accept=".pdf,application/pdf" required>
              <i class="fas fa-cloud-upload-alt"></i>
              <div class="title">اضغط لاختيار ملف PDF أو اسحبه هنا</div>
              <div class="sub">الحد الأقصى 10 ميجابايت - PDF فقط</div>
            </label>
            <div class="file-name" id="fileNameDisplay">
              <i class="fas fa-check-circle"></i>
              <span id="fileNameText"></span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="uploadBtn">
            <i class="fas fa-cloud-upload-alt"></i>
            رفع النتيجة
          </button>

        </form>
      </div>

      <div class="card">
        <h3>
          <i class="fas fa-history"></i>
          النتائج الحالية للمريض
        </h3>
        <div class="recent-uploads" id="recentUploads">
          <div class="empty-mini">
            <i class="fas fa-spinner fa-spin"></i>
            جاري التحميل...
          </div>
        </div>
      </div>

    </div>

  </main>


  <!-- =======================================================
       PREVIEW MODAL
  ======================================================= -->

  <div class="preview-overlay" id="previewOverlay">
    <div class="preview-modal">

      <div class="preview-header">

        <div class="preview-title">
          <i class="fas fa-file-pdf"></i>
          <div class="t-info">
            <h3 id="previewFileName">-</h3>
            <p id="previewSubtitle">-</p>
          </div>
        </div>

        <div class="preview-actions">
          <button class="btn btn-success btn-sm" type="button" onclick="printPreview()">
            <i class="fas fa-print"></i>
            <span>طباعة</span>
          </button>

          <a href="#" class="btn btn-primary btn-sm" id="previewDownloadBtn" target="_blank" rel="noopener">
            <i class="fas fa-download"></i>
            <span>تحميل</span>
          </a>

          <button class="btn btn-danger btn-sm" type="button" onclick="closePreview()">
            <i class="fas fa-times"></i>
            <span>إغلاق</span>
          </button>
        </div>

      </div>

      <div class="preview-body">
        <div class="preview-loading" id="previewLoading">
          <div class="preview-spinner"></div>
          <p>جاري تحميل المعاينة...</p>
        </div>
        <iframe id="previewFrame" src="about:blank"></iframe>
      </div>

      <div class="preview-info-bar" id="previewInfoBar"></div>

    </div>
  </div>


  <!-- =======================================================
       SUPABASE
  ======================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  (function () {
    'use strict';

    const SUPABASE_URL = 'https://rlkqifdteyccagpdtdmu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XibO6Ri8DLKHG-rUEp4Bnw_bDzm67Xf';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (sessionStorage.getItem('medlab_admin_logged_in') !== '1') {
      window.location.href = 'login.html';
      return;
    }

    const $ = id => document.getElementById(id);

    let currentPatient = null;
    let currentPreviewUrl = '';

    function escapeHtml(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showAlert(id, msg, type) {
      const el = document.getElementById(id);
      el.className = 'alert ' + type + ' show';
      el.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${escapeHtml(msg)}`;
      setTimeout(() => el.classList.remove('show'), 5000);
    }

    function formatDate(d) {
      if (!d) return '-';
      try {
        return new Date(d).toLocaleDateString('ar-EG');
      } catch { return d; }
    }

    function getFileUrl(filePath) {
      return `${SUPABASE_URL}/storage/v1/object/public/results/${filePath}`;
    }


    /* ============================================================
       SEARCH PATIENT
    ============================================================ */
    async function searchPatient() {
      const code = $('searchCode').value.trim();

      if (!code) {
        showAlert('searchAlert', 'الرجاء إدخال كود المريض أو رقم الهاتف', 'error');
        return;
      }

      const btn = $('searchBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري البحث...';

      try {
        let { data: patient, error } = await supabaseClient
          .from('patients')
          .select('*')
          .eq('patient_code', code)
          .maybeSingle();

        if (error && error.code !== 'PGRST116') throw error;

        if (!patient) {
          const res = await supabaseClient
            .from('patients')
            .select('*')
            .eq('phone', code)
            .maybeSingle();

          if (res.error && res.error.code !== 'PGRST116') throw res.error;
          patient = res.data;
        }

        if (!patient) {
          $('uploadSection').classList.add('hidden');
          currentPatient = null;
          showAlert('searchAlert', '❌ لا يوجد مريض بهذا الكود أو الهاتف', 'error');
          return;
        }

        currentPatient = patient;
        renderPatientInfo(patient);
        await loadPatientResults(patient);
        $('uploadSection').classList.remove('hidden');
        $('searchAlert').classList.remove('show');

        $('uploadSection').scrollIntoView({ behavior: 'smooth', block: 'start' });

      } catch (error) {
        console.error(error);
        showAlert('searchAlert', 'حدث خطأ: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-search"></i> بحث';
      }
    }


    /* ============================================================
       RENDER PATIENT INFO
    ============================================================ */
    function renderPatientInfo(p) {
      $('patientInfoBox').innerHTML = `
        <div class="info-item">
          <i class="fas fa-user"></i>
          <span>الاسم: <strong>${escapeHtml(p.full_name || '-')}</strong></span>
        </div>
        <div class="info-item">
          <i class="fas fa-id-card"></i>
          <span>الكود: <strong>${escapeHtml(p.patient_code || '-')}</strong></span>
        </div>
        <div class="info-item">
          <i class="fas fa-phone"></i>
          <span>الهاتف: <strong dir="ltr">${escapeHtml(p.phone || '-')}</strong></span>
        </div>
        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <span>البريد: <strong dir="ltr">${escapeHtml(p.email || '-')}</strong></span>
        </div>
      `;
    }


    /* ============================================================
       LOAD PATIENT RESULTS
    ============================================================ */
    async function loadPatientResults(patient) {
      const container = $('recentUploads');
      container.innerHTML = `
        <div class="empty-mini">
          <i class="fas fa-spinner fa-spin"></i>
          جاري التحميل...
        </div>`;

      try {
        const { data: results, error } = await supabaseClient
          .from('results')
          .select('*')
          .eq('patient_id', patient.id)
          .order('result_date', { ascending: false });

        if (error) throw error;

        if (!results || results.length === 0) {
          container.innerHTML = `
            <div class="empty-mini">
              <i class="fas fa-folder-open"></i>
              لا توجد نتائج مسجلة بعد
            </div>`;
          return;
        }

        container.innerHTML = results.map((r, i) => {
          const fileUrl = getFileUrl(r.file_path);
          return `
            <div class="upload-item" style="animation-delay: ${Math.min(i * 0.04, 0.4)}s">
              <div class="info">
                <div class="fname">${escapeHtml(r.file_name || '-')}</div>
                <div class="fmeta">
                  <span><i class="fas fa-calendar"></i> ${formatDate(r.result_date)}</span>
                  <span><i class="fas fa-flask"></i> ${escapeHtml(r.test_type || 'عام')}</span>
                </div>
              </div>

              <div class="item-actions">
                <button class="btn btn-primary btn-sm" type="button" title="معاينة"
                        onclick="window.previewResult('${escapeHtml(r.file_path)}', '${escapeHtml(r.file_name || '')}', '${escapeHtml(r.result_date || '')}', '${escapeHtml(r.test_type || '')}')">
                  <i class="fas fa-eye"></i>
                  معاينة
                </button>
                <a href="${fileUrl}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" title="تحميل">
                  <i class="fas fa-download"></i>
                </a>
                <button class="btn btn-danger btn-sm" type="button" title="حذف"
                        onclick="window.deleteResult(${r.id}, '${escapeHtml(r.file_path)}')">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');

      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="empty-mini">
            <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>
            حدث خطأ في التحميل
          </div>`;
      }
    }


    /* ============================================================
       PREVIEW
    ============================================================ */
    window.previewResult = function (filePath, fileName, resultDate, testType) {
      const fileUrl = getFileUrl(filePath);
      currentPreviewUrl = fileUrl;

      $('previewFileName').textContent = fileName || 'نتيجة تحليل';
      $('previewSubtitle').textContent =
        `${currentPatient ? currentPatient.full_name : ''} • ${formatDate(resultDate)}`;

      $('previewDownloadBtn').href = fileUrl;

      const frame = $('previewFrame');
      const loading = $('previewLoading');
      loading.classList.remove('hidden');
      frame.src = 'about:blank';

      setTimeout(() => {
        frame.src = fileUrl;
        frame.onload = () => {
          setTimeout(() => loading.classList.add('hidden'), 400);
        };
      }, 100);

      let infoHtml = `
        <div class="info-chip">
          <i class="fas fa-user"></i>
          المريض: <strong>${escapeHtml(currentPatient ? currentPatient.full_name : '-')}</strong>
        </div>
        <div class="info-chip">
          <i class="fas fa-id-card"></i>
          الكود: <strong>${escapeHtml(currentPatient ? currentPatient.patient_code : '-')}</strong>
        </div>
        <div class="info-chip">
          <i class="fas fa-calendar"></i>
          التاريخ: <strong>${formatDate(resultDate)}</strong>
        </div>
      `;

      if (testType) {
        infoHtml += `
          <div class="info-chip">
            <i class="fas fa-flask"></i>
            النوع: <strong>${escapeHtml(testType)}</strong>
          </div>`;
      }

      $('previewInfoBar').innerHTML = infoHtml;
      $('previewOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
    };

    window.closePreview = function () {
      $('previewOverlay').classList.remove('show');
      $('previewFrame').src = 'about:blank';
      currentPreviewUrl = '';
      document.body.style.overflow = '';
    };

    window.printPreview = function () {
      if (!currentPreviewUrl) return;
      const win = window.open(currentPreviewUrl, '_blank');
      if (win) {
        win.onload = function () {
          setTimeout(() => {
            try { win.print(); } catch (e) { console.warn(e); }
          }, 500);
        };
      }
    };


    /* ============================================================
       DELETE RESULT
    ============================================================ */
    window.deleteResult = async function (resultId, filePath) {
      if (!confirm('هل أنت متأكد من حذف هذه النتيجة؟')) return;

      try {
        if (filePath) {
          try {
            await supabaseClient.storage.from('results').remove([filePath]);
          } catch (e) {
            console.warn('Storage delete failed:', e);
          }
        }

        const { error } = await supabaseClient
          .from('results')
          .delete()
          .eq('id', resultId);

        if (error) throw error;

        showAlert('uploadAlert', '✅ تم حذف النتيجة', 'success');
        await loadPatientResults(currentPatient);

      } catch (error) {
        console.error(error);
        showAlert('uploadAlert', 'فشل الحذف: ' + error.message, 'error');
      }
    };


    /* ============================================================
       FILE INPUT
    ============================================================ */
    const pdfInput = $('pdfFile');
    const fileDrop = $('fileDrop');
    const fileNameDisplay = $('fileNameDisplay');
    const fileNameText = $('fileNameText');

    pdfInput.addEventListener('change', function () {
      if (this.files && this.files[0]) {
        fileNameText.textContent = this.files[0].name + ' (' + (this.files[0].size / 1024 / 1024).toFixed(2) + ' MB)';
        fileNameDisplay.classList.add('show');
      } else {
        fileNameDisplay.classList.remove('show');
      }
    });

    fileDrop.addEventListener('dragover', e => {
      e.preventDefault();
      fileDrop.classList.add('dragover');
    });

    fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));

    fileDrop.addEventListener('drop', e => {
      e.preventDefault();
      fileDrop.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        pdfInput.files = e.dataTransfer.files;
        pdfInput.dispatchEvent(new Event('change'));
      }
    });


    /* ============================================================
       UPLOAD RESULT
    ============================================================ */
    $('uploadForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      if (!currentPatient) {
        return showAlert('uploadAlert', 'اختر مريضاً أولاً', 'error');
      }

      const fileName = $('fileName').value.trim();
      const testType = $('testType').value.trim();
      const resultDate = $('resultDate').value;
      const notes = $('notes').value.trim();
      const file = pdfInput.files[0];

      if (!fileName || !resultDate || !file) {
        return showAlert('uploadAlert', 'الرجاء ملء كل الحقول المطلوبة واختيار ملف', 'error');
      }

      if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
        return showAlert('uploadAlert', 'يجب أن يكون الملف PDF فقط', 'error');
      }

      if (file.size > 10 * 1024 * 1024) {
        return showAlert('uploadAlert', 'حجم الملف يتجاوز 10 ميجا', 'error');
      }

      const btn = $('uploadBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الرفع...';

      try {
        const safeCode = (currentPatient.patient_code || 'unknown').replace(/[^a-zA-Z0-9]/g, '_');
        const safeName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const filePath = `${safeCode}/${safeName}`;

        const { error: uploadError } = await supabaseClient
          .storage
          .from('results')
          .upload(filePath, file, {
            cacheControl: '3600',
            upsert: false,
            contentType: 'application/pdf'
          });

        if (uploadError) throw uploadError;

        const { error: dbError } = await supabaseClient
          .from('results')
          .insert({
            patient_id: currentPatient.id,
            file_name: fileName,
            file_path: filePath,
            result_date: resultDate,
            test_type: testType || null,
            notes: notes || null
          });

        if (dbError) throw dbError;

        showAlert('uploadAlert', '✅ تم رفع النتيجة بنجاح', 'success');

        this.reset();
        fileNameDisplay.classList.remove('show');

        await loadPatientResults(currentPatient);

        setTimeout(() => {
          window.previewResult(filePath, fileName, resultDate, testType);
        }, 600);

      } catch (error) {
        console.error(error);
        showAlert('uploadAlert', 'فشل الرفع: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> رفع النتيجة';
      }
    });


    /* ============================================================
       EVENTS
    ============================================================ */
    $('searchBtn').addEventListener('click', searchPatient);

    $('searchCode').addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchPatient();
      }
    });

    $('previewOverlay').addEventListener('click', function (e) {
      if (e.target === this) window.closePreview();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if ($('previewOverlay').classList.contains('show')) {
          window.closePreview();
        }
      }
    });

    $('resultDate').value = new Date().toISOString().split('T')[0];

    const urlParams = new URLSearchParams(window.location.search);
    const codeFromUrl = urlParams.get('code') || urlParams.get('phone');
    if (codeFromUrl) {
      $('searchCode').value = codeFromUrl;
      setTimeout(() => searchPatient(), 500);
    }

    console.log('✅ Upload Result ready');
  })();
  </script>
