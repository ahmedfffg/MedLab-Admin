<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الباقات - معمل ميدلاب</title>
  <link href="../images/logo.png" type="image/x-icon" rel="icon">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #0a7cb8;
      --primary-dark: #085a87;
      --primary-light: #3fa4df;
      --blue-soft: #e8f4fb;
      --blue-softer: #f3f9fd;
      --border: #d8e8f2;
      --text-dark: #143a52;
      --text-medium: #3c6478;
      --text-light: #6d8fa3;
      --success: #1a7d4a;
      --success-soft: #e8f8ef;
      --danger: #c0392b;
      --danger-soft: #fdecea;
      --warning: #d97706;
      --warning-soft: #fff4e5;
      --white: #ffffff;
      --shadow: 0 8px 24px -8px rgba(10, 60, 100, 0.15);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: #f4f9fc;
      color: var(--text-dark);
      line-height: 1.7;
      min-height: 100vh;
    }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    /* Topbar */
    .topbar {
      position: sticky; top:0; z-index:100;
      height: 70px;
      background: white;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(10,60,100,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }
    .brand {
      display: flex; align-items: center; gap: 12px; text-decoration: none;
    }
    .brand-logo {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 20px;
    }
    .brand-text h1 { color: var(--primary-dark); font-size: 1.15rem; line-height: 1.2; }
    .brand-text span { color: var(--text-light); font-size: 12px; }

    .top-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--primary-dark);
      padding: 9px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      text-decoration: none;
    }
    .top-btn:hover { background: var(--blue-soft); border-color: var(--primary); }

    /* Page */
    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 25px 60px;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .page-head h2 { color: var(--primary-dark); font-size: 1.7rem; margin-bottom: 6px; }
    .page-head p { color: var(--text-light); font-size: 14.5px; }

    .add-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      padding: 13px 22px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px -6px rgba(10,124,184,0.5);
      transition: 0.25s;
    }
    .add-btn:hover { transform: translateY(-2px); }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .stat-icon {
      width: 50px; height: 50px;
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .stat-icon.blue { background: var(--blue-soft); color: var(--primary); }
    .stat-icon.green { background: var(--success-soft); color: var(--success); }
    .stat-icon.orange { background: var(--warning-soft); color: var(--warning); }
    .stat-icon.purple { background: #f1edff; color: #6950a8; }
    .stat-info span { display: block; color: var(--text-light); font-size: 13px; margin-bottom: 3px; }
    .stat-info strong { display: block; color: var(--primary-dark); font-size: 1.6rem; line-height: 1; }

    /* Toolbar */
    .toolbar {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1.6fr 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .toolbar input, .toolbar select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--blue-softer);
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .toolbar input:focus, .toolbar select:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(10,124,184,0.08);
    }
    .toolbar-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--primary-dark);
      padding: 11px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13.5px;
    }
    .toolbar-btn:hover { background: var(--blue-soft); border-color: var(--primary); }

    /* Packages grid */
    .packages-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .package-card {
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: 0.25s;
      display: flex;
      flex-direction: column;
    }
    .package-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px -10px rgba(10,60,100,0.2);
    }

    .package-image {
      height: 160px;
      background: linear-gradient(135deg, var(--blue-soft), var(--blue-softer));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      color: var(--primary);
      position: relative;
      overflow: hidden;
    }
    .package-image img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .status-badge {
      position: absolute;
      top: 12px; right: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      backdrop-filter: blur(4px);
    }
    .status-badge.active {
      background: rgba(232, 248, 239, 0.95);
      color: var(--success);
    }
    .status-badge.inactive {
      background: rgba(253, 236, 234, 0.95);
      color: var(--danger);
    }

    .package-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
    .package-body h3 {
      color: var(--primary-dark);
      font-size: 1.05rem;
      margin-bottom: 8px;
    }
    .package-body .desc {
      color: var(--text-light);
      font-size: 13px;
      margin-bottom: 12px;
      min-height: 40px;
      line-height: 1.6;
    }
    .package-price {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: var(--blue-softer);
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .package-price span { color: var(--text-light); font-size: 13px; }
    .package-price strong { color: var(--primary); font-size: 1.3rem; }

    .package-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-light);
      margin-bottom: 14px;
    }
    .package-meta i { color: var(--primary); margin-left: 4px; }

    .package-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: auto;
    }
    .package-actions .btn {
      padding: 10px;
      font-size: 13px;
      border-radius: 9px;
      border: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
      font-family: inherit;
    }
    .btn-edit {
      background: var(--blue-soft);
      color: var(--primary);
    }
    .btn-edit:hover { background: var(--primary); color: white; }
    .btn-delete {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .btn-delete:hover { background: var(--danger); color: white; }
    .btn-toggle {
      grid-column: 1 / -1;
      background: var(--warning-soft);
      color: var(--warning);
    }
    .btn-toggle:hover { background: var(--warning); color: white; }

    /* Loading / empty */
    .loading { text-align: center; padding: 60px; grid-column: 1 / -1; }
    .spinner {
      display: inline-block;
      width: 40px; height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: var(--text-light);
    }
    .empty-state i {
      font-size: 50px;
      margin-bottom: 15px;
      color: var(--border);
      display: block;
    }
    .empty-state h3 { color: var(--text-dark); margin-bottom: 8px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 40, 60, 0.5);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 20px;
      width: 100%;
      max-width: 800px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      color: var(--primary-dark);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-header h3 i { color: var(--primary); }
    .close-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: none;
      background: var(--blue-soft);
      color: var(--text-light);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .close-btn:hover { background: var(--danger-soft); color: var(--danger); }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .form-group label i { color: var(--primary); font-size: 12px; }
    .form-group label .required { color: var(--danger); }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--blue-softer);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
      color: var(--text-dark);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(10,124,184,0.08);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .btn {
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      box-shadow: 0 6px 18px -6px rgba(10,124,184,0.5);
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: var(--blue-soft);
      color: var(--primary-dark);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--blue-softer); }

    /* Tests selector */
    .tests-selector {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--blue-softer);
    }
    .tests-search {
      padding: 12px;
      background: white;
      border-bottom: 1px solid var(--border);
    }
    .tests-search input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--blue-softer);
      font-size: 13.5px;
      outline: none;
    }
    .tests-search input:focus { border-color: var(--primary); background: white; }

    .tests-list {
      max-height: 240px;
      overflow-y: auto;
      padding: 6px;
    }
    .test-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.15s;
    }
    .test-row:hover { background: white; }
    .test-row input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .test-row .t-info { flex: 1; }
    .test-row .t-name { font-weight: 700; color: var(--text-dark); font-size: 13.5px; }
    .test-row .t-cat { font-size: 11.5px; color: var(--text-light); }
    .test-row .t-price { font-weight: 700; color: var(--success); font-size: 13px; }

    .selected-tests {
      margin-top: 14px;
    }
    .selected-tests-title {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }
    .selected-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .selected-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--blue-soft);
      color: var(--primary-dark);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .selected-chip button {
      width: 18px; height: 18px;
      border: none;
      border-radius: 50%;
      background: rgba(10,124,184,0.15);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    .selected-chip button:hover { background: var(--primary); color: white; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 90px;
      left: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: white;
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 280px;
      max-width: 420px;
      border-right: 4px solid var(--primary);
      animation: toastIn 0.3s ease;
      pointer-events: all;
      font-size: 14px;
      font-weight: 600;
    }
    .toast.success { border-right-color: var(--success); color: var(--success); }
    .toast.error   { border-right-color: var(--danger);  color: var(--danger); }
    .toast.warning { border-right-color: var(--warning); color: var(--warning); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 1100px) {
      .packages-grid { grid-template-columns: repeat(2, 1fr); }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 900px) {
      .topbar { padding: 0 15px; height: 64px; }
      .brand-text span { display: none; }
      .page { padding: 20px 15px 50px; }
      .page-head h2 { font-size: 1.4rem; }
      .toolbar { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .packages-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .page-head { flex-direction: column; align-items: stretch; }
      .add-btn { justify-content: center; }
      .form-row { grid-template-columns: 1fr; }
      .top-btn span { display: none; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="admin.html" class="brand">
      <div class="brand-logo"><i class="fas fa-box-open"></i></div>
      <div class="brand-text">
        <h1>معمل ميدلاب</h1>
        <span>إدارة الباقات</span>
      </div>
    </a>
    <a href="admin.html" class="top-btn">
      <i class="fas fa-arrow-right"></i> <span>لوحة التحكم</span>
    </a>
  </header>

  <main class="page">

    <div class="page-head">
      <div>
        <h2><i class="fas fa-box-open"></i> إدارة الباقات والعروض</h2>
        <p>إضافة وتعديل الباقات وربطها بالتحاليل</p>
      </div>
      <button class="add-btn" onclick="openPackageModal()">
        <i class="fas fa-plus"></i> إضافة باقة جديدة
      </button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-boxes-stacked"></i></div>
        <div class="stat-info">
          <span>إجمالي الباقات</span>
          <strong id="totalPackages">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
        <div class="stat-info">
          <span>الباقات النشطة</span>
          <strong id="activePackages">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><i class="fas fa-pause-circle"></i></div>
        <div class="stat-info">
          <span>الباقات الموقوفة</span>
          <strong id="inactivePackages">0</strong>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple"><i class="fas fa-flask"></i></div>
        <div class="stat-info">
          <span>إجمالي روابط التحاليل</span>
          <strong id="totalLinkedTests">0</strong>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="🔍 ابحث باسم الباقة...">
      <select id="statusFilter">
        <option value="all">كل الباقات</option>
        <option value="active">النشطة فقط</option>
        <option value="inactive">الموقوفة فقط</option>
      </select>
      <button class="toolbar-btn" onclick="loadData()">
        <i class="fas fa-sync"></i> تحديث
      </button>
    </div>

    <div class="packages-grid" id="packagesGrid">
      <div class="loading"><div class="spinner"></div></div>
    </div>

  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="packageModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle"><i class="fas fa-box-open"></i> إضافة باقة</h3>
        <button class="close-btn" onclick="closeModal('packageModal')">×</button>
      </div>

      <form id="packageForm">
        <div class="modal-body">
          <input type="hidden" id="packageId">

          <div class="form-row">
            <div class="form-group">
              <label><i class="fas fa-box"></i> اسم الباقة <span class="required">*</span></label>
              <input type="text" id="packageName" required>
            </div>
            <div class="form-group">
              <label><i class="fas fa-money-bill"></i> السعر (ج.م) <span class="required">*</span></label>
              <input type="number" id="packagePrice" min="0" step="0.5" required>
            </div>
          </div>

          <div class="form-group">
            <label><i class="fas fa-align-right"></i> وصف الباقة</label>
            <textarea id="packageDesc" rows="2"></textarea>
          </div>

          <div class="form-group">
            <label><i class="fas fa-image"></i> رابط صورة الباقة (اختياري)</label>
            <input type="url" id="packageImage" placeholder="https://...">
          </div>

          <div class="form-group">
            <label><i class="fas fa-toggle-on"></i> حالة الباقة</label>
            <select id="packageActive">
              <option value="true">نشطة</option>
              <option value="false">موقوفة</option>
            </select>
          </div>

          <div class="form-group">
            <label><i class="fas fa-flask"></i> التحاليل داخل الباقة <span class="required">*</span></label>

            <div class="tests-selector">
              <div class="tests-search">
                <input type="text" id="testSearchInput" placeholder="🔍 ابحث عن تحليل...">
              </div>
              <div class="tests-list" id="testsList"></div>
            </div>

            <div class="selected-tests">
              <div class="selected-tests-title">
                <span>التحاليل المختارة</span>
                <span id="selectedCount">0 تحليل</span>
              </div>
              <div class="selected-list" id="selectedList">
                <span style="color:var(--text-light); font-size:12.5px;">لم تختر تحاليل بعد</span>
              </div>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal('packageModal')">إلغاء</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">
            <i class="fas fa-save"></i> حفظ
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://rlkqifdteyccagpdtdmu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XibO6Ri8DLKHG-rUEp4Bnw_bDzm67Xf';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (sessionStorage.getItem('medlab_admin_logged_in') !== '1') {
      window.location.href = 'admin.html';
    }

    let allPackages = [];
    let allTests = [];
    let allPackageTests = [];
    let filteredPackages = [];
    let selectedTestIds = new Set();
    let editingId = null;

    // ============================================
    // HELPERS
    // ============================================
    function escapeHtml(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg, type = 'success') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;

      let icon = 'fa-check-circle';
      if (type === 'error') icon = 'fa-exclamation-circle';
      else if (type === 'warning') icon = 'fa-exclamation-triangle';

      t.innerHTML = `<i class="fas ${icon}"></i> <span>${escapeHtml(msg)}</span>`;
      c.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(-20px)';
        setTimeout(() => t.remove(), 300);
      }, 3500);
    }

    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function formatPrice(p) {
      return Number(p || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
    }

    // ============================================
    // LOAD DATA
    // ============================================
    async function loadData() {
      const grid = document.getElementById('packagesGrid');
      grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        // Tests
        const { data: tests, error: tErr } = await supabaseClient
          .from('tests')
          .select('id, name, price, is_active, category_id')
          .order('name');

        if (tErr) throw tErr;
        allTests = tests || [];

        // Categories للعرض
        const { data: cats } = await supabaseClient
          .from('test_categories')
          .select('id, name');
        const catMap = {};
        (cats || []).forEach(c => catMap[c.id] = c.name);

        allTests = allTests.map(t => ({ ...t, category_name: catMap[t.category_id] || '' }));

        // Packages
        const { data: packages, error: pErr } = await supabaseClient
          .from('packages')
          .select('*')
          .order('created_at', { ascending: false });

        if (pErr) throw pErr;
        allPackages = packages || [];

        // Package Tests links
        const { data: links, error: lErr } = await supabaseClient
          .from('package_tests')
          .select('package_id, test_id');

        if (lErr) throw lErr;
        allPackageTests = links || [];

        updateStats();
        applyFilters();

      } catch (error) {
        console.error(error);
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-circle" style="color: var(--danger);"></i>
            <h3>حدث خطأ</h3>
            <p>${escapeHtml(error.message)}</p>
          </div>`;
        showToast('فشل تحميل البيانات', 'error');
      }
    }

    function updateStats() {
      document.getElementById('totalPackages').textContent = allPackages.length;
      document.getElementById('activePackages').textContent = allPackages.filter(p => p.is_active !== false).length;
      document.getElementById('inactivePackages').textContent = allPackages.filter(p => p.is_active === false).length;
      document.getElementById('totalLinkedTests').textContent = allPackageTests.length;
    }

    // ============================================
    // FILTERS
    // ============================================
    function applyFilters() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const status = document.getElementById('statusFilter').value;

      filteredPackages = allPackages.filter(p => {
        if (search && !String(p.name || '').toLowerCase().includes(search)) return false;
        if (status === 'active' && p.is_active === false) return false;
        if (status === 'inactive' && p.is_active !== false) return false;
        return true;
      });

      renderPackages();
    }

    // ============================================
    // RENDER PACKAGES
    // ============================================
    function renderPackages() {
      const grid = document.getElementById('packagesGrid');

      if (filteredPackages.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-box-open"></i>
            <h3>لا توجد باقات</h3>
            <p>${allPackages.length === 0 ? 'ابدأ بإضافة باقة جديدة' : 'جرّب تغيير الفلاتر'}</p>
          </div>`;
        return;
      }

      grid.innerHTML = filteredPackages.map(p => {
        const testsCount = allPackageTests.filter(pt => Number(pt.package_id) === Number(p.id)).length;
        const isActive = p.is_active !== false;

        // حساب قيمة التحاليل
        const linkedTestIds = allPackageTests
          .filter(pt => Number(pt.package_id) === Number(p.id))
          .map(pt => Number(pt.test_id));

        const testsTotal = allTests
          .filter(t => linkedTestIds.includes(Number(t.id)))
          .reduce((s, t) => s + Number(t.price || 0), 0);

        const savings = testsTotal - Number(p.price || 0);

        const imageHtml = p.image_url
          ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
          : '';

        return `
          <div class="package-card">
            <div class="package-image">
              ${imageHtml}
              <i class="fas fa-box-open" style="${p.image_url ? 'display:none;' : ''}"></i>
              <span class="status-badge ${isActive ? 'active' : 'inactive'}">
                ${isActive ? '● نشطة' : '● موقوفة'}
              </span>
            </div>

            <div class="package-body">
              <h3>${escapeHtml(p.name || '-')}</h3>
              <p class="desc">${escapeHtml(p.description || 'لا يوجد وصف')}</p>

              <div class="package-price">
                <span>سعر الباقة</span>
                <strong>${formatPrice(p.price)} ج</strong>
              </div>

              <div class="package-meta">
                <span><i class="fas fa-flask"></i> ${testsCount} تحليل</span>
                <span>${savings > 0 ? `وفر ${formatPrice(savings)} ج` : '—'}</span>
              </div>

              <div class="package-actions">
                <button class="btn btn-edit" onclick="openPackageModal(${p.id})">
                  <i class="fas fa-edit"></i> تعديل
                </button>
                <button class="btn btn-delete" onclick="deletePackage(${p.id})">
                  <i class="fas fa-trash"></i> حذف
                </button>
                <button class="btn btn-toggle" onclick="togglePackage(${p.id})">
                  <i class="fas fa-${isActive ? 'pause' : 'play'}"></i>
                  ${isActive ? 'إيقاف الباقة' : 'تفعيل الباقة'}
                </button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    // ============================================
    // PACKAGE MODAL
    // ============================================
    function openPackageModal(id = null) {
      const form = document.getElementById('packageForm');
      form.reset();
      selectedTestIds = new Set();

      if (id) {
        const p = allPackages.find(x => x.id === id);
        if (!p) return;

        editingId = id;
        document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> تعديل الباقة';
        document.getElementById('packageId').value = p.id;
        document.getElementById('packageName').value = p.name || '';
        document.getElementById('packagePrice').value = p.price || 0;
        document.getElementById('packageDesc').value = p.description || '';
        document.getElementById('packageImage').value = p.image_url || '';
        document.getElementById('packageActive').value = String(p.is_active !== false);

        // اختر التحاليل المرتبطة
        allPackageTests
          .filter(pt => Number(pt.package_id) === Number(id))
          .forEach(pt => selectedTestIds.add(Number(pt.test_id)));

      } else {
        editingId = null;
        document.getElementById('modalTitle').innerHTML = '<i class="fas fa-box-open"></i> إضافة باقة';
        document.getElementById('packageId').value = '';
        document.getElementById('packageActive').value = 'true';
      }

      renderTestsList();
      renderSelectedTests();
      openModal('packageModal');
    }

    function renderTestsList() {
      const search = document.getElementById('testSearchInput').value.trim().toLowerCase();

      const filtered = allTests.filter(t => {
        if (t.is_active === false) return false;
        if (search && !String(t.name || '').toLowerCase().includes(search)) return false;
        return true;
      });

      const list = document.getElementById('testsList');

      if (filtered.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-light);">لا توجد تحاليل</div>';
        return;
      }

      list.innerHTML = filtered.map(t => {
        const checked = selectedTestIds.has(Number(t.id));
        return `
          <label class="test-row">
            <input type="checkbox" 
                   ${checked ? 'checked' : ''}
                   onchange="toggleTestSelection(${t.id}, this.checked)">
            <div class="t-info">
              <div class="t-name">${escapeHtml(t.name)}</div>
              <div class="t-cat">${escapeHtml(t.category_name || '')}</div>
            </div>
            <div class="t-price">${formatPrice(t.price)} ج</div>
          </label>`;
      }).join('');
    }

    function toggleTestSelection(id, checked) {
      if (checked) selectedTestIds.add(Number(id));
      else selectedTestIds.delete(Number(id));
      renderSelectedTests();
    }

    function renderSelectedTests() {
      const container = document.getElementById('selectedList');
      const countEl = document.getElementById('selectedCount');

      countEl.textContent = `${selectedTestIds.size} تحليل`;

      if (selectedTestIds.size === 0) {
        container.innerHTML = '<span style="color:var(--text-light); font-size:12.5px;">لم تختر تحاليل بعد</span>';
        return;
      }

      container.innerHTML = Array.from(selectedTestIds).map(id => {
        const t = allTests.find(x => Number(x.id) === id);
        if (!t) return '';
        return `
          <span class="selected-chip">
            ${escapeHtml(t.name)}
            <button type="button" onclick="removeSelected(${t.id})" title="حذف">
              <i class="fas fa-times"></i>
            </button>
          </span>`;
      }).join('');
    }

    function removeSelected(id) {
      selectedTestIds.delete(Number(id));
      renderTestsList();
      renderSelectedTests();
    }

    // ============================================
    // SAVE PACKAGE
    // ============================================
    document.getElementById('packageForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const name = document.getElementById('packageName').value.trim();
      const price = Number(document.getElementById('packagePrice').value);
      const desc = document.getElementById('packageDesc').value.trim();
      const image = document.getElementById('packageImage').value.trim();
      const isActive = document.getElementById('packageActive').value === 'true';

      if (!name || !Number.isFinite(price) || price < 0) {
        return showToast('املأ الحقول المطلوبة بشكل صحيح', 'warning');
      }

      if (selectedTestIds.size === 0) {
        return showToast('اختر تحليل واحد على الأقل', 'warning');
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

      try {
        let packageId = editingId;

        const payload = {
          name,
          description: desc || null,
          price,
          image_url: image || null,
          is_active: isActive
        };

        if (editingId) {
          // تعديل
          const { error } = await supabaseClient
            .from('packages')
            .update(payload)
            .eq('id', editingId);
          if (error) throw error;

          // حذف الروابط القديمة
          const { error: delErr } = await supabaseClient
            .from('package_tests')
            .delete()
            .eq('package_id', editingId);
          if (delErr) throw delErr;

        } else {
          // إضافة جديدة
          const { data, error } = await supabaseClient
            .from('packages')
            .insert(payload)
            .select()
            .single();
          if (error) throw error;
          packageId = data.id;
        }

        // إدراج الروابط الجديدة
        const rows = Array.from(selectedTestIds).map((testId, i) => ({
          package_id: packageId,
          test_id: Number(testId),
          sort_order: i
        }));

        const { error: linkErr } = await supabaseClient
          .from('package_tests')
          .insert(rows);
        if (linkErr) throw linkErr;

        showToast(editingId ? '✅ تم التعديل' : '✅ تم الإضافة', 'success');
        closeModal('packageModal');
        await loadData();

      } catch (error) {
        console.error(error);
        if (error.code === '23505') showToast('اسم الباقة موجود بالفعل', 'error');
        else showToast('فشل الحفظ: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
      }
    });

    // ============================================
    // DELETE / TOGGLE
    // ============================================
    async function deletePackage(id) {
      const p = allPackages.find(x => x.id === id);
      if (!p) return;

      if (!confirm(`هل تريد حذف الباقة "${p.name}"؟`)) return;

      try {
        const { error } = await supabaseClient
          .from('packages')
          .delete()
          .eq('id', id);

        if (error) throw error;
        showToast('✅ تم الحذف', 'success');
        await loadData();

      } catch (error) {
        console.error(error);
        showToast('فشل الحذف', 'error');
      }
    }

    async function togglePackage(id) {
      const p = allPackages.find(x => x.id === id);
      if (!p) return;

      const newStatus = p.is_active === false;

      try {
        const { error } = await supabaseClient
          .from('packages')
          .update({ is_active: newStatus })
          .eq('id', id);

        if (error) throw error;
        showToast(newStatus ? '✅ تم التفعيل' : '✅ تم الإيقاف', 'success');
        await loadData();

      } catch (error) {
        console.error(error);
        showToast('فشل التعديل', 'error');
      }
    }

    // ============================================
    // EVENTS
    // ============================================
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('statusFilter').addEventListener('change', applyFilters);
    document.getElementById('testSearchInput').addEventListener('input', renderTestsList);

    document.getElementById('packageModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal('packageModal');
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal('packageModal');
    });

    // Start
    loadData();

    console.log('✅ صفحة الباقات جاهزة');
  </script>
